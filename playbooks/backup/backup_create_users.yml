---
- name: Crear usuario de respaldo MongoDB (TLS)
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/common.yml"
    - "{{ playbook_dir }}/../../vars/local.yml"
    - "{{ playbook_dir }}/../../vars/vault_mongodb.yml"

  vars:
    mongo_network: "mongo_swarm_net"

  tasks:

    - name: Validar existencia de certificado CA publico
      ansible.builtin.stat:
        path: "{{ mongo_tls_ca_cert_path }}"
      register: mongo_ca_stat

    - name: Exigir certificado CA publico
      ansible.builtin.assert:
        that:
          - mongo_ca_stat.stat.exists
          - mongo_ca_stat.stat.isreg
        fail_msg: "[ERROR] Certificado CA no encontrado: {{ mongo_tls_ca_cert_path }}"
        success_msg: "[OK] Certificado CA verificado en el host"

    - name: Crear o actualizar usuario de respaldo via TLS en Replica Set
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - --env
          - MONGO_BACKUP_USER
          - --env
          - MONGO_BACKUP_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            const adminUser = process.env.MONGO_ADMIN_USER;
            const adminPass = process.env.MONGO_ADMIN_PASSWORD;
            const backupUser = process.env.MONGO_BACKUP_USER;
            const backupPass = process.env.MONGO_BACKUP_PASSWORD;
            const uri = `mongodb://mongo1:27017,mongo2:27017,mongo3:27017/{{ mongo_backup_auth_database | default('admin') }}?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
            const db = connect(uri);
            db.auth(adminUser, adminPass);
            const authDB = process.env.MONGO_BACKUP_AUTH_DB || "{{ mongo_backup_auth_database | default('admin') }}";
            const targetAuthDB = db.getSiblingDB(authDB);
            const existing = targetAuthDB.getUser(backupUser);
            if (!existing) {
              targetAuthDB.createUser({
                user: backupUser,
                pwd: backupPass,
                roles: [
                  { role: "backup", db: "admin" },
                  { role: "readAnyDatabase", db: "admin" },
                  { role: "read", db: "{{ mongo_database }}" }
                ]
              });
              print("USER_STATUS=CREATED");
            } else {
              targetAuthDB.updateUser(backupUser, {
                pwd: backupPass,
                roles: [
                  { role: "backup", db: "admin" },
                  { role: "readAnyDatabase", db: "admin" },
                  { role: "read", db: "{{ mongo_database }}" }
                ]
              });
              print("USER_STATUS=UPDATED");
            }
            print("PRIMARY=" + db.hello().primary);
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
        MONGO_BACKUP_USER: "{{ mongo_backup_user }}"
        MONGO_BACKUP_PASSWORD: "{{ mongo_backup_password }}"
      register: backup_user_raw
      changed_when: true
      no_log: true

    - name: Interpretar resultado de gestion de usuario
      ansible.builtin.set_fact:
        backup_user_status: "{{ backup_user_raw.stdout_lines | select('match', '^USER_STATUS=') | first | regex_replace('^USER_STATUS=', '') }}"
        backup_user_primary: "{{ backup_user_raw.stdout_lines | select('match', '^PRIMARY=') | first | regex_replace('^PRIMARY=', '') }}"

    - name: Validar autenticacion y permisos del usuario de backup via TLS
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_BACKUP_USER
          - --env
          - MONGO_BACKUP_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            const user = process.env.MONGO_BACKUP_USER;
            const pass = process.env.MONGO_BACKUP_PASSWORD;
            const uri = `mongodb://mongo1:27017,mongo2:27017,mongo3:27017/{{ mongo_backup_auth_database | default('admin') }}?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
            try {
              const db = connect(uri);
              db.auth(user, pass);
              const targetDB = db.getSiblingDB("{{ mongo_database }}");
              const ping = targetDB.runCommand({ ping: 1 });
              if (ping.ok !== 1) quit(1);
              const cols = targetDB.getCollectionNames();
              print("AUTH_STATUS=READ_OK:" + cols.length);
            } catch(e) {
              print("AUTH_STATUS=ERROR:" + e.message);
              quit(1);
            }
      environment:
        MONGO_BACKUP_USER: "{{ mongo_backup_user }}"
        MONGO_BACKUP_PASSWORD: "{{ mongo_backup_password }}"
      register: backup_auth_raw
      changed_when: false
      no_log: true

    - name: Confirmar usuario y permisos de lectura de backup
      ansible.builtin.assert:
        that:
          - backup_auth_raw.rc == 0
          - "'READ_OK' in backup_auth_raw.stdout"
        fail_msg: "[ERROR] El usuario de backup no pudo autenticarse o no tiene permisos sobre {{ mongo_database }}"
        success_msg: "[OK] Autenticacion y permisos de lectura validados sobre {{ mongo_database }} via TLS"

    - name: Confirmar usuario de backup
      ansible.builtin.debug:
        msg:
          - "[OK] Usuario de backup configurado: {{ mongo_backup_user }} ({{ backup_user_status }})"
          - "[OK] Base autorizada: {{ mongo_database }}"
          - "[OK] PRIMARY: {{ backup_user_primary }}"
          - "[OK] Permisos de lectura validados via TLS"
          - "[OK] Principio de minimo privilegio aplicado"
