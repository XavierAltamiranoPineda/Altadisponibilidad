---
- name: Validar respaldo MongoDB
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/common.yml"

  vars:
    target_environment: "local"

  tasks:

    # ============================================================
    # CARGA DE VARIABLES DEL AMBIENTE
    # ============================================================

    - name: "Cargar variables del ambiente: {{ target_environment }}"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../vars/{{ target_environment }}.yml"

    # ============================================================
    # VALIDACION DE CONFIGURACION
    # ============================================================

    - name: Validar algoritmo de checksum configurado
      ansible.builtin.assert:
        that:
          - backup_checksum_algorithm == "sha256"
        fail_msg: >-
          [ERROR] Algoritmo de checksum no soportado.
          Esperado: sha256
          Configurado: {{ backup_checksum_algorithm }}
        success_msg: "[OK] Algoritmo de checksum validado: {{ backup_checksum_algorithm }}"

    # ============================================================
    # BUSQUEDA Y VALIDACION DEL BACKUP
    # ============================================================

    - name: Buscar respaldo mas reciente
      ansible.builtin.shell: |
        find "{{ backup_root }}/{{ mongo_database }}" \
          -type f \
          -name "{{ mongo_database }}_*{{ backup_extension }}" \
          -printf '%T@ %p\n' \
          | sort -nr \
          | head -n1 \
          | cut -d' ' -f2-
      register: latest_backup
      changed_when: false

    - name: Validar que exista al menos un respaldo
      ansible.builtin.assert:
        that:
          - latest_backup.stdout | length > 0
        fail_msg: "[ERROR] No se encontro ningun respaldo para {{ mongo_database }}"
        success_msg: "[OK] Respaldo encontrado"

    - name: Definir archivo de respaldo
      ansible.builtin.set_fact:
        backup_file_path: "{{ latest_backup.stdout }}"
        checksum_file_path: "{{ latest_backup.stdout }}.sha256"

    - name: Obtener informacion del respaldo
      ansible.builtin.stat:
        path: "{{ backup_file_path }}"
      register: backup_file_stat

    - name: Obtener informacion del checksum
      ansible.builtin.stat:
        path: "{{ checksum_file_path }}"
      register: checksum_file_stat

    - name: Validar existencia y tamaño del respaldo
      ansible.builtin.assert:
        that:
          - backup_file_stat.stat.exists
          - backup_file_stat.stat.isreg
          - backup_file_stat.stat.size | int > 0
        fail_msg: "[ERROR] El archivo de respaldo no es valido"
        success_msg: "[OK] Archivo de respaldo existente y no vacio"

    - name: Validar existencia del archivo SHA-256
      ansible.builtin.assert:
        that:
          - checksum_file_stat.stat.exists
          - checksum_file_stat.stat.isreg
          - checksum_file_stat.stat.size | int > 0
        fail_msg: "[ERROR] No existe el archivo SHA-256 asociado"
        success_msg: "[OK] Archivo SHA-256 encontrado"

    - name: Validar checksum SHA-256
      ansible.builtin.shell: |
        cd "$(dirname "{{ backup_file_path }}")"
        sha256sum -c "$(basename "{{ checksum_file_path }}")"
      register: checksum_validation
      changed_when: false

    - name: Confirmar checksum
      ansible.builtin.assert:
        that:
          - checksum_validation.rc == 0
        fail_msg: "[ERROR] El checksum SHA-256 no coincide"
        success_msg: "[OK] Integridad SHA-256 validada"

    - name: Validar convencion de nombre institucional
      ansible.builtin.assert:
        that:
          - >
            backup_file_path | basename
            is match('^' ~ mongo_database ~ '_[0-9]{8}_[0-9]{6}' ~ (backup_extension | regex_escape) ~ '$')
        fail_msg: "[ERROR] El nombre del respaldo no cumple la convencion institucional"
        success_msg: "[OK] Convencion de nombre validada"

    # ============================================================
    # VALIDACION DE MONGODB DATABASE TOOLS
    # ============================================================

    - name: Verificar disponibilidad de mongodump en el host
      ansible.builtin.command:
        cmd: "{{ mongodb_tools_root }}/{{ mongodb_tools_version }}/bin/mongodump --version"
      register: mongodump_version
      changed_when: false

    - name: Verificar disponibilidad de mongorestore en el host
      ansible.builtin.command:
        cmd: "{{ mongodb_tools_root }}/{{ mongodb_tools_version }}/bin/mongorestore --version"
      register: mongorestore_version
      changed_when: false

    - name: Validar version aprobada de mongodump
      ansible.builtin.assert:
        that:
          - "'mongodump version: ' ~ mongodb_tools_version in mongodump_version.stdout"
        fail_msg: >-
          [ERROR] Version incorrecta de mongodump.
          Esperada: {{ mongodb_tools_version }}
        success_msg: "[OK] mongodump {{ mongodb_tools_version }} validado"

    - name: Validar version aprobada de mongorestore
      ansible.builtin.assert:
        that:
          - "'mongorestore version: ' ~ mongodb_tools_version in mongorestore_version.stdout"
        fail_msg: >-
          [ERROR] Version incorrecta de mongorestore.
          Esperada: {{ mongodb_tools_version }}
        success_msg: "[OK] mongorestore {{ mongodb_tools_version }} validado"

    # ============================================================
    # RESULTADO
    # ============================================================

    - name: Mostrar resultado final
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VALIDACION DE BACKUP COMPLETADA"
          - "============================================================"
          - "Ambiente: {{ environment_name }}"
          - "Base: {{ mongo_database }}"
          - "Archivo: {{ backup_file_path }}"
          - "Tamaño: {{ backup_file_stat.stat.size }} bytes"
          - "SHA-256: OK"
          - "Nombre institucional: OK"
          - "mongodump: {{ mongodb_tools_version }}"
          - "mongorestore: {{ mongodb_tools_version }}"
          - "Estado: BACKUP INTEGRO Y PREPARADO PARA PRUEBA DE RESTORE"
          - "============================================================"