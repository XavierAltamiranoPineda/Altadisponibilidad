---
# ============================================================
# TAREAS DE RESTAURACION Y VALIDACION REUTILIZABLES
# ============================================================

- name: Detectar PRIMARY actual del Replica Set via TLS
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - "{{ mongo_backup_network }}"
      - -v
      - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
      - --env
      - MONGO_ADMIN_USER
      - --env
      - MONGO_ADMIN_PASSWORD
      - "{{ mongo_image }}"
      - mongosh
      - --quiet
      - --nodb
      - --eval
      - |
        const user = process.env.MONGO_ADMIN_USER;
        const pass = process.env.MONGO_ADMIN_PASSWORD;
        const uri = `mongodb://mongo1:27017,mongo2:27017,mongo3:27017/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
        const db = connect(uri);
        db.auth(user, pass);
        print("PRIMARY=" + db.hello().primary);
  environment:
    MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
    MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
  register: mongo_primary_raw
  changed_when: false
  no_log: true

- name: Interpretar PRIMARY
  ansible.builtin.set_fact:
    mongo_primary_service: "{{ mongo_primary_raw.stdout_lines | select('match', '^PRIMARY=') | first | regex_replace('^PRIMARY=', '') }}"

- name: Validar version aprobada de Database Tools en la imagen Docker
  ansible.builtin.command:
    cmd: "docker run --rm {{ mongo_backup_tools_image }} mongorestore --version"
  register: mongorestore_version
  changed_when: false

- name: Validar version 100.18.0 de mongorestore
  ansible.builtin.assert:
    that:
      - "'mongorestore version: ' ~ mongodb_tools_version in mongorestore_version.stdout"
    fail_msg: "[ERROR] Version incorrecta de mongorestore en imagen {{ mongo_backup_tools_image }}. Esperada: {{ mongodb_tools_version }}"
    success_msg: "[OK] mongorestore {{ mongodb_tools_version }} validado en imagen {{ mongo_backup_tools_image }}"

- name: Validar existencia del certificado CA publico en el host para restore
  ansible.builtin.stat:
    path: "{{ mongo_tls_ca_cert_path }}"
  register: restore_host_ca_cert_stat

- name: Exigir certificado CA publico para restore seguro
  ansible.builtin.assert:
    that:
      - restore_host_ca_cert_stat.stat.exists
      - restore_host_ca_cert_stat.stat.isreg
    fail_msg: >-
      [ERROR] No se encontro el certificado CA publico en el host: {{ mongo_tls_ca_cert_path }}.
      Asegurese de que la infraestructura PKI este aprovisionada antes de ejecutar la restauracion.
    success_msg: "[OK] Certificado CA publico verificado en el host: {{ mongo_tls_ca_cert_path }}"

- name: Eliminar base temporal previa en el Replica Set via TLS si existe
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - "{{ mongo_backup_network }}"
      - -v
      - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
      - --env
      - MONGO_ADMIN_USER
      - --env
      - MONGO_ADMIN_PASSWORD
      - "{{ mongo_image }}"
      - mongosh
      - --quiet
      - --nodb
      - --eval
      - |
        const user = process.env.MONGO_ADMIN_USER;
        const pass = process.env.MONGO_ADMIN_PASSWORD;
        const uri = `mongodb://mongo1:27017,mongo2:27017,mongo3:27017/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
        const db = connect(uri);
        db.auth(user, pass);
        db.getSiblingDB("{{ restore_test_database }}").dropDatabase();
        print("TEMP_DB_DROPPED");
  environment:
    MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
    MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
  changed_when: true
  no_log: true

- name: Generar identificador unico para runner de restore
  ansible.builtin.shell: |
    date +%Y%m%d_%H%M%S
  register: restore_runner_timestamp
  changed_when: false

- name: Definir nombre del contenedor runner de restore
  ansible.builtin.set_fact:
    restore_runner_name: "mongo_restore_runner_{{ restore_runner_timestamp.stdout | trim }}"

- name: Validar checksum SHA-256 antes de descifrar y restaurar
  ansible.builtin.shell: |
    cd "{{ backup_file_path | dirname }}"
    sha256sum -c "{{ backup_filename }}.sha256"
  register: restore_checksum_validation
  changed_when: false

- name: Exigir integridad SHA-256 valida antes de restaurar
  ansible.builtin.assert:
    that:
      - restore_checksum_validation.rc == 0
    fail_msg: "[ERROR] Fallo la verificacion SHA-256 del archivo de respaldo previo a la restauracion."

- name: Ejecutar mongorestore con contenedor temporal HA y garantia de limpieza
  block:
    - name: Restaurar respaldo via red overlay HA
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        CFG_FILE="$(mktemp /tmp/mongorestore_cfg.XXXXXX)"
        trap 'rm -f "$CFG_FILE"' EXIT INT TERM
        printf 'password: |-\n  %s\n' "$MONGO_RESTORE_PASSWORD" > "$CFG_FILE"
        chmod 0600 "$CFG_FILE"

        cat "{{ backup_file_path }}" | \
        docker run --rm -i \
          --name "{{ restore_runner_name }}" \
          --network "{{ mongo_backup_network }}" \
          --env MONGO_RESTORE_USER \
          --env MONGO_RESTORE_PASSWORD \
          -v "$CFG_FILE:$CFG_FILE:ro" \
          -v "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro" \
          "{{ mongo_backup_tools_image }}" \
          mongorestore \
            --config="$CFG_FILE" \
            --uri="{{ mongo_backup_uri }}" \
            --sslCAFile="{{ mongo_tls_client_ca_file }}" \
            --username="$MONGO_RESTORE_USER" \
            --authenticationDatabase=admin \
            --gzip \
            --archive \
            --nsFrom="{{ mongo_database }}.*" \
            --nsTo="{{ restore_test_database }}.*"
      environment:
        MONGO_RESTORE_USER: "{{ mongo_restore_user }}"
        MONGO_RESTORE_PASSWORD: "{{ mongo_restore_password }}"
      register: restore_result
      changed_when: true
      no_log: true

  always:
    - name: Limpiar y eliminar contenedor runner de restore si aun existe
      ansible.builtin.command:
        cmd: "docker rm -f {{ restore_runner_name }}"
      register: restore_container_cleanup
      changed_when: false
      failed_when: false
      no_log: true

# ============================================================
# VALIDACION FUNCIONAL POR CONTEO DE DOCUMENTOS
# ============================================================
# Esta es una validacion funcional basica por conteo de documentos.
# No representa una comprobacion criptografica de igualdad completa.

- name: Obtener cantidad de documentos en base original via TLS
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - "{{ mongo_backup_network }}"
      - -v
      - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
      - --env
      - MONGO_ADMIN_USER
      - --env
      - MONGO_ADMIN_PASSWORD
      - "{{ mongo_image }}"
      - mongosh
      - --quiet
      - --nodb
      - --eval
      - |
        const user = process.env.MONGO_ADMIN_USER;
        const pass = process.env.MONGO_ADMIN_PASSWORD;
        const uri = `mongodb://mongo1:27017,mongo2:27017,mongo3:27017/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
        const db = connect(uri);
        db.auth(user, pass);
        const targetDB = db.getSiblingDB("{{ mongo_database }}");
        let total = 0;
        targetDB.getCollectionNames().forEach(c => {
          total += targetDB.getCollection(c).countDocuments({});
        });
        print("DOC_COUNT=" + total);
  environment:
    MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
    MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
  register: original_documents_raw
  changed_when: false
  no_log: true

- name: Interpretar conteo original
  ansible.builtin.set_fact:
    original_doc_count: "{{ original_documents_raw.stdout_lines | select('match', '^DOC_COUNT=') | first | regex_replace('^DOC_COUNT=', '') }}"

- name: Obtener cantidad de documentos en base restaurada via TLS
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - "{{ mongo_backup_network }}"
      - -v
      - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
      - --env
      - MONGO_ADMIN_USER
      - --env
      - MONGO_ADMIN_PASSWORD
      - "{{ mongo_image }}"
      - mongosh
      - --quiet
      - --nodb
      - --eval
      - |
        const user = process.env.MONGO_ADMIN_USER;
        const pass = process.env.MONGO_ADMIN_PASSWORD;
        const uri = `mongodb://mongo1:27017,mongo2:27017,mongo3:27017/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
        const db = connect(uri);
        db.auth(user, pass);
        const targetDB = db.getSiblingDB("{{ restore_test_database }}");
        let total = 0;
        targetDB.getCollectionNames().forEach(c => {
          total += targetDB.getCollection(c).countDocuments({});
        });
        print("DOC_COUNT=" + total);
  environment:
    MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
    MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
  register: restored_documents_raw
  changed_when: false
  no_log: true

- name: Interpretar conteo restaurado
  ansible.builtin.set_fact:
    restored_doc_count: "{{ restored_documents_raw.stdout_lines | select('match', '^DOC_COUNT=') | first | regex_replace('^DOC_COUNT=', '') }}"

- name: Validar coincidencia de documentos restaurados
  ansible.builtin.assert:
    that:
      - original_doc_count | int == restored_doc_count | int
    fail_msg: >-
      [ERROR] La cantidad de documentos restaurados no coincide.
      Original={{ original_doc_count }}
      Restaurada={{ restored_doc_count }}
    success_msg: "[OK] Validacion de restauracion exitosa via TLS (Documentos: {{ original_doc_count }})"
