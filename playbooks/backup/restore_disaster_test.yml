---
- name: Prueba controlada de recuperacion ante desastre MongoDB (TLS)
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/common.yml"
    - "{{ playbook_dir }}/../../vars/local.yml"
    - "{{ playbook_dir }}/../../vars/vault_mongodb.yml"

  tasks:

    # ============================================================
    # VALIDACION DE PKI Y CA
    # ============================================================

    - name: Validar existencia del certificado CA publico en el host
      ansible.builtin.stat:
        path: "{{ mongo_tls_ca_cert_path }}"
      register: disaster_ca_stat

    - name: Exigir certificado CA publico
      ansible.builtin.assert:
        that:
          - disaster_ca_stat.stat.exists
          - disaster_ca_stat.stat.isreg
        fail_msg: "[ERROR] Certificado CA no encontrado: {{ mongo_tls_ca_cert_path }}"
        success_msg: "[OK] Certificado CA verificado en el host"

    # ============================================================
    # LOCALIZAR EL BACKUP MAS RECIENTE
    # ============================================================

    - name: Incluir seleccion de respaldo por timestamp
      ansible.builtin.include_tasks: tasks/restore_select_backup_tasks.yml

    # ============================================================
    # VALIDAR INTEGRIDAD PREVIA CON SHA-256
    # ============================================================

    - name: Validar checksum SHA-256 antes del restore
      ansible.builtin.shell: |
        cd "$(dirname "{{ backup_file_path }}")"
        sha256sum -c "$(basename "{{ checksum_file_path }}")"
      register: checksum_validation
      changed_when: false
      failed_when: false

    - name: Confirmar integridad previa
      ansible.builtin.assert:
        that:
          - checksum_validation.rc == 0
        fail_msg: "[ERROR] El backup no supera la validacion SHA-256"
        success_msg: "[OK] Integridad SHA-256 validada antes de la simulacion"

    # ============================================================
    # DETECTAR PRIMARY Y ESTADO ACTUAL PREVIO
    # ============================================================

    - name: Obtener estado original antes de la simulacion via TLS
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_backup_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            const user = process.env.MONGO_ADMIN_USER;
            const pass = process.env.MONGO_ADMIN_PASSWORD;
            const uri = `mongodb://mongo1:27017,mongo2:27018,mongo3:27019/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
            const db = connect(uri);
            db.auth(user, pass);
            const targetDB = db.getSiblingDB("{{ mongo_database }}");
            const collections = targetDB.getCollectionNames().sort();
            let total = 0;
            collections.forEach(c => {
              total += targetDB.getCollection(c).countDocuments({});
            });
            print("STATE_JSON=" + JSON.stringify({
              primary: db.hello().primary,
              collections: collections,
              collectionCount: collections.length,
              documentCount: total
            }));
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: original_state_raw
      changed_when: false
      no_log: true

    - name: Interpretar estado original
      ansible.builtin.set_fact:
        original_state: >-
          {{
            (original_state_raw.stdout_lines
             | select('match', '^STATE_JSON=') | first
             | regex_replace('^STATE_JSON=', ''))
            | from_json
          }}
      no_log: true

    - name: Mostrar estado original
      ansible.builtin.debug:
        msg:
          - "PRIMARY: {{ original_state.primary }}"
          - "Colecciones: {{ original_state.collectionCount }}"
          - "Documentos: {{ original_state.documentCount }}"

    # ============================================================
    # SIMULAR DESASTRE: ELIMINAR BASE ORIGINAL
    # ============================================================

    - name: Eliminar base original en el Replica Set via TLS
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_backup_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            const user = process.env.MONGO_ADMIN_USER;
            const pass = process.env.MONGO_ADMIN_PASSWORD;
            const uri = `mongodb://mongo1:27017,mongo2:27018,mongo3:27019/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
            const db = connect(uri);
            db.auth(user, pass);
            const res = db.getSiblingDB("{{ mongo_database }}").dropDatabase();
            if (res.ok !== 1) quit(1);
            print("DATABASE_DROPPED");
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: database_drop
      changed_when: true
      no_log: true

    # ============================================================
    # CONFIRMAR PERDIDA
    # ============================================================

    - name: Verificar que la base fue eliminada via TLS
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_backup_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            const user = process.env.MONGO_ADMIN_USER;
            const pass = process.env.MONGO_ADMIN_PASSWORD;
            const uri = `mongodb://mongo1:27017,mongo2:27018,mongo3:27019/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
            const db = connect(uri);
            db.auth(user, pass);
            const exists = db.getMongo().getDBNames().includes("{{ mongo_database }}");
            print("STATUS=" + (exists ? "EXISTS" : "REMOVED"));
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: database_removed_raw
      changed_when: false
      no_log: true

    - name: Confirmar simulacion de perdida
      ansible.builtin.assert:
        that:
          - "'STATUS=REMOVED' in database_removed_raw.stdout"
        fail_msg: "[ERROR] No se pudo confirmar la eliminacion de {{ mongo_database }}"
        success_msg: "[OK] PERDIDA SIMULADA: {{ mongo_database }} fue eliminada"

    - name: Pausa para verificar eliminacion en MongoDB Compass
      ansible.builtin.pause:
        seconds: 5
        prompt: >-
          [INFO] La base {{ mongo_database }} fue eliminada.
          Refresca MongoDB Compass para visualizar la perdida simulada.
          La restauracion continuara automaticamente en 5 segundos.

    # ============================================================
    # RESTAURACION REAL
    # ============================================================

    - name: Generar identificador de runner de restauracion
      ansible.builtin.shell: date +%Y%m%d_%H%M%S
      register: disaster_runner_timestamp
      changed_when: false

    - name: Definir nombre del contenedor runner de desastre
      ansible.builtin.set_fact:
        disaster_runner_name: "mongo_disaster_restore_{{ disaster_runner_timestamp.stdout | trim }}"

    - name: Restaurar base original desde el backup via TLS
      block:
        - name: Ejecutar mongorestore para recuperacion de desastre
          ansible.builtin.shell: |
            set -euo pipefail
            umask 077
            CFG_FILE="$(mktemp /tmp/mongorestore_cfg.XXXXXX)"
            trap 'rm -f "$CFG_FILE"' EXIT INT TERM
            printf 'password: |-\n  %s\n' "$MONGO_RESTORE_PASSWORD" > "$CFG_FILE"
            chmod 0600 "$CFG_FILE"

            cat "{{ backup_file_path }}" | \
            docker run --rm -i \
              --name "{{ disaster_runner_name }}" \
              --network "{{ mongo_backup_network }}" \
              --env MONGO_RESTORE_USER \
              --env MONGO_RESTORE_PASSWORD \
              -v "$CFG_FILE:$CFG_FILE:ro" \
              -v "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro" \
              "{{ mongo_backup_tools_image }}" \
              mongorestore \
                --config="$CFG_FILE" \
                --uri="{{ mongo_backup_uri }}" \
                --sslCAFile="{{ mongo_tls_client_ca_file }}" \
                --username="$MONGO_RESTORE_USER" \
                --authenticationDatabase=admin \
                --gzip \
                --archive \
                --nsInclude="{{ mongo_database }}.*"
          environment:
            MONGO_RESTORE_USER: "{{ mongo_restore_user }}"
            MONGO_RESTORE_PASSWORD: "{{ mongo_restore_password }}"
          register: restore_result
          changed_when: true
          no_log: true

      always:
        - name: Limpiar contenedor runner de desastre si persiste
          ansible.builtin.command:
            cmd: "docker rm -f {{ disaster_runner_name }}"
          changed_when: false
          failed_when: false
          no_log: true

    # ============================================================
    # VALIDACION POST-RESTORE
    # ============================================================

    - name: Obtener estado despues de restaurar via TLS
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_backup_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            const user = process.env.MONGO_ADMIN_USER;
            const pass = process.env.MONGO_ADMIN_PASSWORD;
            const uri = `mongodb://mongo1:27017,mongo2:27018,mongo3:27019/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
            const db = connect(uri);
            db.auth(user, pass);
            const targetDB = db.getSiblingDB("{{ mongo_database }}");
            const collections = targetDB.getCollectionNames().sort();
            let total = 0;
            collections.forEach(c => {
              total += targetDB.getCollection(c).countDocuments({});
            });
            print("RESTORED_JSON=" + JSON.stringify({
              collections: collections,
              collectionCount: collections.length,
              documentCount: total
            }));
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: restored_state_raw
      changed_when: false
      no_log: true

    - name: Interpretar estado restaurado
      ansible.builtin.set_fact:
        restored_state: >-
          {{
            (restored_state_raw.stdout_lines
             | select('match', '^RESTORED_JSON=') | first
             | regex_replace('^RESTORED_JSON=', ''))
            | from_json
          }}
      no_log: true

    - name: Comparar colecciones recuperadas
      ansible.builtin.assert:
        that:
          - original_state.collections == restored_state.collections
          - original_state.collectionCount | int == restored_state.collectionCount | int
        fail_msg: "[ERROR] Las colecciones restauradas no coinciden con el estado original"
        success_msg: "[OK] Colecciones restauradas correctamente"

    - name: Comparar cantidad de documentos recuperados
      ansible.builtin.assert:
        that:
          - original_state.documentCount | int == restored_state.documentCount | int
        fail_msg: >-
          [ERROR] Documentos no coinciden.
          Antes={{ original_state.documentCount }}
          Restaurados={{ restored_state.documentCount }}
        success_msg: "[OK] Documentos recuperados correctamente: {{ restored_state.documentCount }}"

    # ============================================================
    # VALIDAR REPLICA SET
    # ============================================================

    - name: Verificar estado del Replica Set via TLS
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_backup_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            const user = process.env.MONGO_ADMIN_USER;
            const pass = process.env.MONGO_ADMIN_PASSWORD;
            const uri = `mongodb://mongo1:27017,mongo2:27018,mongo3:27019/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
            const db = connect(uri);
            db.auth(user, pass);
            const status = db.adminCommand({ replSetGetStatus: 1 });
            print("REPLSET_STATUS=" + JSON.stringify(
              status.members.map(m => ({
                name: m.name,
                stateStr: m.stateStr,
                health: m.health
              }))
            ));
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: replica_status_raw
      changed_when: false
      no_log: true

    - name: Interpretar estado del Replica Set
      ansible.builtin.set_fact:
        replica_status: >-
          {{
            (replica_status_raw.stdout_lines
             | select('match', '^REPLSET_STATUS=') | first
             | regex_replace('^REPLSET_STATUS=', ''))
            | from_json
          }}
      no_log: true

    - name: Mostrar estado del Replica Set
      ansible.builtin.debug:
        msg: "{{ replica_status }}"

    # ============================================================
    # RESULTADO FINAL
    # ============================================================

    - name: Mostrar resultado final
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "PRUEBA FINAL DE RECUPERACION COMPLETADA (TLS)"
          - "============================================================"
          - "Ambiente: {{ environment_name }}"
          - "Base recuperada: {{ mongo_database }}"
          - "Backup utilizado: {{ backup_file_path }}"
          - "PRIMARY: {{ original_state.primary }}"
          - "Colecciones originales: {{ original_state.collectionCount }}"
          - "Colecciones restauradas: {{ restored_state.collectionCount }}"
          - "Documentos originales: {{ original_state.documentCount }}"
          - "Documentos restaurados: {{ restored_state.documentCount }}"
          - "SHA-256 previo: OK"
          - "mongorestore: {{ mongodb_tools_version }}"
          - "Replica Set: VALIDADO (TLS)"
          - "Estado: RECUPERACION ANTE DESASTRE VALIDADA"
          - "============================================================"
