---
- name: Crear usuario de restauracion MongoDB (TLS)
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/common.yml"
    - "{{ playbook_dir }}/../../vars/local.yml"
    - "{{ playbook_dir }}/../../vars/vault_mongodb.yml"

  vars:
    mongo_network: "mongo_swarm_net"

  tasks:

    - name: Validar existencia de certificado CA publico
      ansible.builtin.stat:
        path: "{{ mongo_tls_ca_cert_path }}"
      register: mongo_ca_stat

    - name: Exigir certificado CA publico
      ansible.builtin.assert:
        that:
          - mongo_ca_stat.stat.exists
          - mongo_ca_stat.stat.isreg
        fail_msg: "[ERROR] Certificado CA no encontrado: {{ mongo_tls_ca_cert_path }}"
        success_msg: "[OK] Certificado CA verificado en el host"

    - name: Crear o actualizar usuario de restauracion via TLS en Replica Set
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - --env
          - MONGO_RESTORE_USER
          - --env
          - MONGO_RESTORE_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            const adminUser = process.env.MONGO_ADMIN_USER;
            const adminPass = process.env.MONGO_ADMIN_PASSWORD;
            const restoreUser = process.env.MONGO_RESTORE_USER;
            const restorePass = process.env.MONGO_RESTORE_PASSWORD;
            const uri = `mongodb://mongo1:27017,mongo2:27017,mongo3:27017/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
            const db = connect(uri);
            db.auth(adminUser, adminPass);
            const adminDB = db.getSiblingDB("admin");
            const existing = adminDB.getUser(restoreUser);
            if (!existing) {
              adminDB.createUser({
                user: restoreUser,
                pwd: restorePass,
                roles: [
                  { role: "restore", db: "admin" }
                ]
              });
              print("USER_STATUS=CREATED");
            } else {
              adminDB.updateUser(restoreUser, {
                pwd: restorePass,
                roles: [
                  { role: "restore", db: "admin" }
                ]
              });
              print("USER_STATUS=UPDATED");
            }
            print("PRIMARY=" + db.hello().primary);
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
        MONGO_RESTORE_USER: "{{ mongo_restore_user }}"
        MONGO_RESTORE_PASSWORD: "{{ mongo_restore_password }}"
      register: restore_user_raw
      changed_when: true
      no_log: true

    - name: Interpretar resultado de gestion de usuario restore
      ansible.builtin.set_fact:
        restore_user_status: "{{ restore_user_raw.stdout_lines | select('match', '^USER_STATUS=') | first | regex_replace('^USER_STATUS=', '') }}"
        restore_user_primary: "{{ restore_user_raw.stdout_lines | select('match', '^PRIMARY=') | first | regex_replace('^PRIMARY=', '') }}"

    - name: Validar autenticacion del usuario de restauracion via TLS
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_RESTORE_USER
          - --env
          - MONGO_RESTORE_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            const user = process.env.MONGO_RESTORE_USER;
            const pass = process.env.MONGO_RESTORE_PASSWORD;
            const uri = `mongodb://mongo1:27017,mongo2:27017,mongo3:27017/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
            try {
              const db = connect(uri);
              db.auth(user, pass);
              const res = db.runCommand({ connectionStatus: 1 });
              if (res.ok === 1 && res.authInfo.authenticatedUsers.length > 0) {
                print("AUTH_STATUS=AUTH_OK");
              } else {
                print("AUTH_STATUS=AUTH_ERROR");
                quit(1);
              }
            } catch(e) {
              print("AUTH_STATUS=ERROR:" + e.message);
              quit(1);
            }
      environment:
        MONGO_RESTORE_USER: "{{ mongo_restore_user }}"
        MONGO_RESTORE_PASSWORD: "{{ mongo_restore_password }}"
      register: restore_auth_raw
      changed_when: false
      no_log: true

    - name: Confirmar autenticacion del usuario de restauracion
      ansible.builtin.assert:
        that:
          - restore_auth_raw.rc == 0
          - "'AUTH_OK' in restore_auth_raw.stdout"
        fail_msg: "[ERROR] El usuario de restauracion no pudo autenticarse sobre TLS"
        success_msg: "[OK] Usuario de restauracion autenticado correctamente sobre TLS"

    - name: Mostrar resultado final
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "USUARIO DE RESTAURACION CONFIGURADO (TLS)"
          - "============================================================"
          - "Usuario: {{ mongo_restore_user }} ({{ restore_user_status }})"
          - "Rol: restore"
          - "Authentication DB: admin"
          - "PRIMARY: {{ restore_user_primary }}"
          - "Autenticacion TLS: OK"
          - "Estado: LISTO PARA MONGORESTORE"
          - "============================================================"
