---
- name: Crear usuario de restauracion MongoDB
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/common.yml"
    - "{{ playbook_dir }}/../../vars/local.yml"
    - "{{ playbook_dir }}/../../vars/vault_mongodb.yml"

  tasks:

    # ============================================================
    # LOCALIZAR UN NODO ACTIVO
    # ============================================================

    - name: Buscar un contenedor MongoDB activo
      ansible.builtin.shell: |
        for service in mongo1 mongo2 mongo3; do
          container=$(docker ps \
            --filter "label=com.docker.swarm.service.name=${service}" \
            --format '{{"{{"}}.ID{{"}}"}}' | head -n1)

          if [ -n "$container" ]; then
            echo "$container"
            exit 0
          fi
        done
        exit 1
      register: mongo_available_container
      changed_when: false

    # ============================================================
    # DETECTAR PRIMARY
    # ============================================================

    - name: Obtener PRIMARY actual del Replica Set
      ansible.builtin.shell: |
        docker exec \
          -e MONGO_ADMIN_USER='{{ mongo_admin_user }}' \
          -e MONGO_ADMIN_PASSWORD='{{ mongo_admin_password }}' \
          {{ mongo_available_container.stdout }} \
          sh -c '
            mongosh \
              --quiet \
              --host 127.0.0.1 \
              --port 27017 \
              --username "$MONGO_ADMIN_USER" \
              --password "$MONGO_ADMIN_PASSWORD" \
              --authenticationDatabase admin \
              --eval "db.hello().primary"
          '
      register: mongo_primary
      changed_when: false
      no_log: true

    - name: Validar PRIMARY
      ansible.builtin.assert:
        that:
          - mongo_primary.stdout | length > 0
          - "':' in mongo_primary.stdout"
        fail_msg: "[ERROR] No se pudo detectar el PRIMARY"
        success_msg: "[OK] PRIMARY detectado"

    - name: Obtener servicio correspondiente al PRIMARY
      ansible.builtin.set_fact:
        mongo_primary_service: "{{ mongo_primary.stdout.split(':')[0] }}"

    - name: Obtener contenedor del PRIMARY
      ansible.builtin.shell: |
        docker ps \
          --filter "label=com.docker.swarm.service.name={{ mongo_primary_service }}" \
          --format '{{"{{"}}.ID{{"}}"}}' | head -n1
      register: mongo_primary_container
      changed_when: false

    - name: Validar contenedor PRIMARY
      ansible.builtin.assert:
        that:
          - mongo_primary_container.stdout | length > 0
        fail_msg: "[ERROR] No se encontro el contenedor correspondiente al PRIMARY"
        success_msg: "[OK] Contenedor PRIMARY localizado"

    # ============================================================
    # CREAR USUARIO DE RESTORE
    # ============================================================

    - name: Crear o actualizar usuario de restauracion
      ansible.builtin.shell: |
        docker exec \
          -e MONGO_ADMIN_USER='{{ mongo_admin_user }}' \
          -e MONGO_ADMIN_PASSWORD='{{ mongo_admin_password }}' \
          -e MONGO_RESTORE_USER='{{ mongo_restore_user }}' \
          -e MONGO_RESTORE_PASSWORD='{{ mongo_restore_password }}' \
          {{ mongo_primary_container.stdout }} \
          sh -c '
            mongosh \
              --quiet \
              --host 127.0.0.1 \
              --port 27017 \
              --username "$MONGO_ADMIN_USER" \
              --password "$MONGO_ADMIN_PASSWORD" \
              --authenticationDatabase admin \
              --eval "
                const adminDB = db.getSiblingDB(\"admin\");
                const existing = adminDB.getUser(\"$MONGO_RESTORE_USER\");

                if (!existing) {
                  adminDB.createUser({
                    user: \"$MONGO_RESTORE_USER\",
                    pwd: \"$MONGO_RESTORE_PASSWORD\",
                    roles: [
                      { role: \"restore\", db: \"admin\" }
                    ]
                  });
                  print(\"CREATED\");
                } else {
                  adminDB.updateUser(
                    \"$MONGO_RESTORE_USER\",
                    {
                      pwd: \"$MONGO_RESTORE_PASSWORD\",
                      roles: [
                        { role: \"restore\", db: \"admin\" }
                      ]
                    }
                  );
                  print(\"UPDATED\");
                }
              "
          '
      register: restore_user_result
      changed_when: true
      no_log: true

    # ============================================================
    # VALIDAR AUTENTICACION
    # ============================================================

    - name: Validar autenticacion del usuario de restauracion
      ansible.builtin.shell: |
        docker exec \
          -e MONGO_RESTORE_USER='{{ mongo_restore_user }}' \
          -e MONGO_RESTORE_PASSWORD='{{ mongo_restore_password }}' \
          {{ mongo_primary_container.stdout }} \
          sh -c '
            mongosh \
              --quiet \
              --host 127.0.0.1 \
              --port 27017 \
              --username "$MONGO_RESTORE_USER" \
              --password "$MONGO_RESTORE_PASSWORD" \
              --authenticationDatabase admin \
              --eval "
                const result = db.runCommand({ connectionStatus: 1 });

                if (
                  result.ok === 1 &&
                  result.authInfo.authenticatedUsers.length > 0
                ) {
                  print(\"AUTH_OK\");
                } else {
                  print(\"AUTH_ERROR\");
                  quit(1);
                }
              "
          '
      register: restore_auth_validation
      changed_when: false
      no_log: true

    - name: Confirmar autenticacion del usuario de restauracion
      ansible.builtin.assert:
        that:
          - restore_auth_validation.rc == 0
          - "'AUTH_OK' in restore_auth_validation.stdout"
        fail_msg: "[ERROR] El usuario de restauracion no pudo autenticarse"
        success_msg: "[OK] Usuario de restauracion autenticado correctamente"

    # ============================================================
    # RESULTADO
    # ============================================================

    - name: Mostrar resultado final
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "USUARIO DE RESTAURACION CONFIGURADO"
          - "============================================================"
          - "Usuario: {{ mongo_restore_user }}"
          - "Rol: restore"
          - "Authentication DB: admin"
          - "PRIMARY: {{ mongo_primary.stdout }}"
          - "Autenticacion: OK"
          - "Estado: LISTO PARA MONGORESTORE"
          - "============================================================"
