---
- name: Ejecutar respaldo MongoDB
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/common.yml"
    - "{{ playbook_dir }}/../../vars/vault_mongodb.yml"

  vars:
    target_environment: "local"

  tasks:

    # ============================================================
    # CARGA DE VARIABLES DEL AMBIENTE
    # ============================================================

    - name: "Cargar variables del ambiente: {{ target_environment }}"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../vars/{{ target_environment }}.yml"

    # ============================================================
    # BLOQUE PRINCIPAL DE EJECUCION DE RESPALDO CON NOTIFICACION
    # ============================================================

    - name: Ciclo de ejecucion de respaldo con captura de fallo y notificacion
      block:

        # ============================================================
        # VALIDACION DE CONFIGURACION Y DOCKER
        # ============================================================

        - name: Validar algoritmo de checksum configurado
          ansible.builtin.assert:
            that:
              - backup_checksum_algorithm == "sha256"
            fail_msg: >-
              [ERROR] Algoritmo de checksum no soportado.
              Esperado: sha256
              Configurado: {{ backup_checksum_algorithm }}
            success_msg: "[OK] Algoritmo de checksum validado: {{ backup_checksum_algorithm }}"

        - name: Validar politica minima de espacio libre
          ansible.builtin.assert:
            that:
              - backup_min_free_percent is defined
              - backup_min_free_percent | int > 0
              - backup_min_free_percent | int < 100
            fail_msg: "[ERROR] La politica de espacio libre minimo no es valida"
            success_msg: "[OK] Politica de espacio libre minimo: {{ backup_min_free_percent }}%"

        - name: Validar variables requeridas de backup HA
          ansible.builtin.assert:
            that:
              - mongo_backup_uri is defined
              - mongo_backup_uri | length > 0
              - mongo_backup_network is defined
              - mongo_backup_network | length > 0
              - mongo_backup_tools_image is defined
              - mongo_backup_tools_image | length > 0
              - mongo_backup_user is defined
              - mongo_backup_user | length > 0
              - mongo_backup_password is defined
              - mongo_backup_password | length > 0
            fail_msg: "[ERROR] Faltan variables requeridas para el respaldo de alta disponibilidad"
            success_msg: "[OK] Variables de respaldo HA validadas"

        - name: Validar que la red overlay exista en Docker
          ansible.builtin.command:
            cmd: "docker network inspect {{ mongo_backup_network }}"
          register: network_check
          changed_when: false

        - name: Validar que la imagen de tools exista localmente
          ansible.builtin.command:
            cmd: "docker image inspect {{ mongo_backup_tools_image }}"
          register: image_check
          changed_when: false

        - name: Validar existencia del certificado CA publico en el host
          ansible.builtin.stat:
            path: "{{ mongo_tls_ca_cert_path }}"
          register: backup_ca_stat

        - name: Exigir certificado CA publico
          ansible.builtin.assert:
            that:
              - backup_ca_stat.stat.exists
              - backup_ca_stat.stat.isreg
            fail_msg: "[ERROR] Certificado CA no encontrado: {{ mongo_tls_ca_cert_path }}"
            success_msg: "[OK] Certificado CA verificado en el host"

        # ============================================================
        # PREPARACION DE DIRECTORIOS Y TIMESTAMP
        # ============================================================

        - name: Generar timestamp institucional
          ansible.builtin.shell: date +%Y%m%d_%H%M%S
          register: backup_time
          changed_when: false

        - name: Obtener mes actual
          ansible.builtin.shell: date +%Y-%m
          register: backup_month
          changed_when: false

        - name: Definir variables del respaldo
          ansible.builtin.set_fact:
            backup_timestamp: "{{ backup_time.stdout | trim }}"
            backup_directory: "{{ backup_root }}/{{ mongo_database }}/{{ backup_month.stdout | trim }}"
            backup_filename: "{{ mongo_database }}_{{ backup_time.stdout | trim }}{{ backup_extension }}"
            backup_container_name: "mongo_backup_runner_{{ backup_time.stdout | trim }}"

        - name: Garantizar directorio de respaldos con permisos 0700
          ansible.builtin.file:
            path: "{{ backup_directory }}"
            state: directory
            mode: "0700"

        - name: Garantizar directorio de bitacoras con permisos 0700
          ansible.builtin.file:
            path: "{{ backup_log_root }}"
            state: directory
            mode: "0700"

        - name: Obtener UID y GID del usuario del host
          ansible.builtin.command:
            cmd: id -u
          register: backup_host_uid
          changed_when: false

        - name: Obtener GID del usuario del host
          ansible.builtin.command:
            cmd: id -g
          register: backup_host_gid
          changed_when: false

        # ============================================================
        # COMPROBACION DE ESPACIO EN DISCO
        # ============================================================

        - name: Obtener espacio disponible en disco
          ansible.builtin.shell: |
            df -P "{{ backup_directory }}" | awk 'NR==2 {print 100 - $5}'
          register: disk_free_percent
          changed_when: false

        - name: Guardar porcentaje de espacio libre
          ansible.builtin.set_fact:
            backup_free_percent: "{{ disk_free_percent.stdout | trim }}"

        - name: Validar umbral de espacio en disco
          ansible.builtin.assert:
            that:
              - (backup_free_percent | int) >= (backup_min_free_percent | int)
            fail_msg: >-
              [ERROR] Espacio insuficiente en disco.
              Libre: {{ backup_free_percent }}%
              Requerido: {{ backup_min_free_percent }}%
            success_msg: "[OK] Espacio en disco suficiente: {{ backup_free_percent }}% libre"

        # ============================================================
        # TRAZABILIDAD DEL REPLICA SET
        # ============================================================

        - name: Consultar PRIMARY actual para trazabilidad via TLS
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - --network
              - "{{ mongo_backup_network }}"
              - -v
              - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
              - --env
              - MONGO_ADMIN_USER
              - --env
              - MONGO_ADMIN_PASSWORD
              - "{{ mongo_image }}"
              - mongosh
              - --quiet
              - --nodb
              - --eval
              - |
                const user = process.env.MONGO_ADMIN_USER;
                const pass = process.env.MONGO_ADMIN_PASSWORD;
                const uri = `mongodb://mongo1:27017,mongo2:27017,mongo3:27017/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
                const db = connect(uri);
                db.auth(user, pass);
                print("PRIMARY_DETECTED=" + db.hello().primary);
          environment:
            MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
            MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
          register: primary_check
          changed_when: false
          no_log: true

        - name: Extraer PRIMARY detectado
          ansible.builtin.set_fact:
            mongo_primary: >-
              {{
                primary_check.stdout_lines
                | select('match', '^PRIMARY_DETECTED=') | first
                | regex_replace('^PRIMARY_DETECTED=', '')
              }}
          no_log: true

        - name: Validar que se detecto un PRIMARY activo
          ansible.builtin.assert:
            that:
              - mongo_primary is defined
              - mongo_primary | length > 0
              - "':' in mongo_primary"
            fail_msg: "[ERROR] No se pudo identificar un nodo PRIMARY en el Replica Set"
            success_msg: "[OK] PRIMARY activo identificado: {{ mongo_primary }}"

        # ============================================================
        # EJECUCION DE MONGODUMP
        # ============================================================

        - name: Ejecutar respaldo con contenedor temporal y garantia de limpieza
          block:
            - name: Ejecutar mongodump dentro del contenedor temporal con UID/GID del host
              ansible.builtin.command:
                argv:
                  - docker
                  - run
                  - --name
                  - "{{ backup_container_name }}"
                  - --user
                  - "{{ backup_host_uid.stdout }}:{{ backup_host_gid.stdout }}"
                  - --network
                  - "{{ mongo_backup_network }}"
                  - --env
                  - MONGO_BACKUP_USER
                  - --env
                  - MONGO_BACKUP_PASSWORD
                  - -v
                  - "{{ backup_directory }}:/backup"
                  - -v
                  - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
                  - "{{ mongo_backup_tools_image }}"
                  - sh
                  - -ec
                  - |
                    umask 077
                    CFG_FILE="$(mktemp /tmp/mongodump_cfg.XXXXXX)"
                    trap 'rm -f "$CFG_FILE"' EXIT INT TERM
                    printf 'password: |-\n  %s\n' "$MONGO_BACKUP_PASSWORD" > "$CFG_FILE"
                    chmod 0600 "$CFG_FILE"
                    mongodump \
                      --config="$CFG_FILE" \
                      --uri="{{ mongo_backup_uri }}" \
                      --sslCAFile="{{ mongo_tls_client_ca_file }}" \
                      --username="$MONGO_BACKUP_USER" \
                      --authenticationDatabase=admin \
                      --db="{{ mongo_database }}" \
                      --gzip \
                      --archive="/backup/{{ backup_filename }}"
              environment:
                MONGO_BACKUP_USER: "{{ mongo_backup_user }}"
                MONGO_BACKUP_PASSWORD: "{{ mongo_backup_password }}"
              register: mongodump_result
              changed_when: true
              no_log: true

          rescue:
            - name: Sanitizar y diagnosticar fallo en mongodump
              vars:
                raw_stderr: "{{ mongodump_result.stderr | default(ansible_failed_result.stderr | default('')) }}"
                raw_stdout: "{{ mongodump_result.stdout | default(ansible_failed_result.stdout | default('')) }}"
                raw_msg: "{{ ansible_failed_result.msg | default('') }}"
                sanitized_stderr: >-
                  {{
                    raw_stderr
                    | regex_replace(mongo_backup_password | regex_escape, '[REDACTED]')
                    | regex_replace('mongodb://[^/\s]+:[^@\s]+@', 'mongodb://[REDACTED]:[REDACTED]@')
                    | regex_replace('(?m)^password:.*$', 'password: [REDACTED]')
                  }}
                sanitized_stdout: >-
                  {{
                    raw_stdout
                    | regex_replace(mongo_backup_password | regex_escape, '[REDACTED]')
                    | regex_replace('mongodb://[^/\s]+:[^@\s]+@', 'mongodb://[REDACTED]:[REDACTED]@')
                    | regex_replace('(?m)^password:.*$', 'password: [REDACTED]')
                  }}
                sanitized_msg: >-
                  {{
                    raw_msg
                    | regex_replace(mongo_backup_password | regex_escape, '[REDACTED]')
                    | regex_replace('mongodb://[^/\s]+:[^@\s]+@', 'mongodb://[REDACTED]:[REDACTED]@')
                  }}
              ansible.builtin.fail:
                msg:
                  error_type: "MONGODUMP_EXECUTION_FAILED"
                  return_code: "{{ mongodump_result.rc | default(ansible_failed_result.rc | default(-1)) }}"
                  sanitized_stderr: "{{ sanitized_stderr }}"
                  sanitized_stdout: "{{ sanitized_stdout }}"
                  details: "{{ sanitized_msg }}"

          always:
            - name: Limpiar y eliminar contenedor temporal de respaldo
              ansible.builtin.command:
                cmd: "docker rm -f {{ backup_container_name }}"
              register: container_cleanup
              changed_when: false
              failed_when: false
              no_log: true

        # ============================================================
        # VALIDACION DEL ARCHIVO GENERADO EN EL HOST Y CHECKSUM
        # ============================================================

        - name: Obtener informacion del archivo generado en el host
          ansible.builtin.stat:
            path: "{{ backup_directory }}/{{ backup_filename }}"
            checksum_algorithm: sha256
          register: backup_file

        - name: Validar existencia y tamaño del respaldo en el host
          ansible.builtin.assert:
            that:
              - backup_file.stat.exists
              - backup_file.stat.isreg
              - backup_file.stat.size | int > 0
            fail_msg: "[ERROR] El archivo de respaldo no fue generado correctamente"
            success_msg: "[OK] Archivo de respaldo generado correctamente en el host"

        - name: Generar archivo SHA-256 en el host
          ansible.builtin.shell: |
            cd "{{ backup_directory }}"
            sha256sum "{{ backup_filename }}" > "{{ backup_filename }}.sha256"
          changed_when: true

        - name: Validar checksum SHA-256 en el host
          ansible.builtin.shell: |
            cd "{{ backup_directory }}"
            sha256sum -c "{{ backup_filename }}.sha256"
          register: checksum_validation
          changed_when: false

        - name: Confirmar integridad del respaldo
          ansible.builtin.assert:
            that:
              - checksum_validation.rc == 0
            fail_msg: "[ERROR] Fallo la validacion SHA-256 del respaldo"
            success_msg: "[OK] Integridad SHA-256 validada en el host"

        # ============================================================
        # BITACORA
        # ============================================================

        - name: Registrar respaldo en bitacora
          ansible.builtin.lineinfile:
            path: "{{ backup_log_root }}/{{ backup_log_filename }}"
            create: true
            mode: "0600"
            insertafter: EOF
            line: >-
              {{ backup_timestamp }}
              | environment={{ environment_name }}
              | database={{ mongo_database }}
              | primary={{ mongo_primary }}
              | replica_set={{ mongo_replica_set }}
              | network={{ mongo_backup_network }}
              | tools_version={{ mongodb_tools_version }}
              | file={{ backup_filename }}
              | size={{ backup_file.stat.size }}
              | checksum=OK
              | free_space_percent_before={{ backup_free_percent }}
              | result=SUCCESS

        # ============================================================
        # RESULTADO
        # ============================================================

        - name: Resultado final del respaldo HA
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "BACKUP MONGODB HA GENERADO EXITOSAMENTE"
              - "============================================================"
              - "Ambiente: {{ environment_name }}"
              - "Base: {{ mongo_database }}"
              - "PRIMARY (trazabilidad): {{ mongo_primary }}"
              - "Espacio libre previo: {{ backup_free_percent }}% (Minimo: {{ backup_min_free_percent }}%)"
              - "Usuario Host ejecutor: UID={{ backup_host_uid.stdout }} GID={{ backup_host_gid.stdout }}"
              - "Red Overlay: {{ mongo_backup_network }}"
              - "URI Backup HA: {{ mongo_backup_uri }}"
              - "Contenedor temporal: {{ backup_container_name }} (eliminado)"
              - "MongoDB Database Tools: {{ mongodb_tools_version }}"
              - "Archivo host: {{ backup_directory }}/{{ backup_filename }}"
              - "Checksum host: {{ backup_directory }}/{{ backup_filename }}.sha256"
              - "Tamaño: {{ backup_file.stat.size }} bytes"
              - "Integridad: OK"
              - "============================================================"

      rescue:
        - name: Establecer motivo de fallo para notificacion
          ansible.builtin.set_fact:
            backup_failure_reason: >-
              {{
                (ansible_failed_result.msg
                 | default(ansible_failed_task.name | default('Fallo durante la generacion o validacion del respaldo')))
                | string
              }}

        - name: Incluir tareas de alerta y notificacion de fallo
          ansible.builtin.include_tasks: tasks/notify_failure_tasks.yml

        - name: Re-fallar ejecucion para mantener estado fallido
          ansible.builtin.fail:
            msg: >-
              [ERROR] El proceso de respaldo ha fallado:
              {{ backup_failure_reason }}
