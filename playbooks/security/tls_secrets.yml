---
- name: Crear y validar Docker Secrets TLS versionados
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/common.yml"
    - "{{ playbook_dir }}/../../vars/{{ target_environment | default('local') }}.yml"

  vars:
    tls_target_environment: "{{ target_environment | default('local') }}"
    mongo_tls_service_names:
      - "mongo1"
      - "mongo2"
      - "mongo3"
    mongo_tls_secret_specs:
      - name: "mongo_tls_ca_{{ mongo_tls_ca_secret_version }}"
        source_path: "{{ mongo_tls_ca_cert_path }}"
        role: "ca"
        node: ""
        version: "{{ mongo_tls_ca_secret_version }}"
      - name: "mongo1_tls_pem_{{ mongo_tls_node_secret_version }}"
        source_path: "{{ mongo_tls_nodes_certificates.mongo1.pem_path }}"
        role: "node"
        node: "mongo1"
        version: "{{ mongo_tls_node_secret_version }}"
      - name: "mongo2_tls_pem_{{ mongo_tls_node_secret_version }}"
        source_path: "{{ mongo_tls_nodes_certificates.mongo2.pem_path }}"
        role: "node"
        node: "mongo2"
        version: "{{ mongo_tls_node_secret_version }}"
      - name: "mongo3_tls_pem_{{ mongo_tls_node_secret_version }}"
        source_path: "{{ mongo_tls_nodes_certificates.mongo3.pem_path }}"
        role: "node"
        node: "mongo3"
        version: "{{ mongo_tls_node_secret_version }}"
    mongo_tls_future_secret_map:
      mongo1:
        - "mongo_keyfile"
        - "mongo_tls_ca_{{ mongo_tls_ca_secret_version }}"
        - "mongo1_tls_pem_{{ mongo_tls_node_secret_version }}"
      mongo2:
        - "mongo_keyfile"
        - "mongo_tls_ca_{{ mongo_tls_ca_secret_version }}"
        - "mongo2_tls_pem_{{ mongo_tls_node_secret_version }}"
      mongo3:
        - "mongo_keyfile"
        - "mongo_tls_ca_{{ mongo_tls_ca_secret_version }}"
        - "mongo3_tls_pem_{{ mongo_tls_node_secret_version }}"

  tasks:
    - name: Validar alcance, versiones y estado TLS deshabilitado
      ansible.builtin.assert:
        that:
          - tls_target_environment == 'local'
          - environment_name == tls_target_environment
          - mongo_tls_provisioning_source in ['ansible_local_ca', 'pki_provided']
          - mongo_tls_provisioning_source == 'ansible_local_ca'
          - not (mongo_tls_enabled | bool)
          - not (mongo_tls_clients_enabled | bool)
          - mongo_tls_deployment_mode == 'disabled'
          - mongo_tls_target_mode == 'requireTLS'
          - mongo_tls_ca_secret_version | regex_search('^[A-Za-z0-9][A-Za-z0-9_.-]*$') is not none
          - mongo_tls_node_secret_version | regex_search('^[A-Za-z0-9][A-Za-z0-9_.-]*$') is not none
          - mongo_tls_secret_specs | map(attribute='name') | list | unique | length == 4
          - mongo_tls_node_names | sort == mongo_tls_service_names | sort
        fail_msg: >-
          Esta etapa solo admite LOCAL con PKI compatible y TLS completamente
          deshabilitado. Las versiones deben ser validas y los nodos deben ser exactos.

    - name: Validar mapa futuro aislado sin aplicarlo
      ansible.builtin.assert:
        that:
          - mongo_tls_future_secret_map.mongo1 == ['mongo_keyfile', 'mongo_tls_ca_' ~ mongo_tls_ca_secret_version, 'mongo1_tls_pem_' ~ mongo_tls_node_secret_version]
          - mongo_tls_future_secret_map.mongo2 == ['mongo_keyfile', 'mongo_tls_ca_' ~ mongo_tls_ca_secret_version, 'mongo2_tls_pem_' ~ mongo_tls_node_secret_version]
          - mongo_tls_future_secret_map.mongo3 == ['mongo_keyfile', 'mongo_tls_ca_' ~ mongo_tls_ca_secret_version, 'mongo3_tls_pem_' ~ mongo_tls_node_secret_version]
        fail_msg: "El mapa futuro de Secrets TLS no conserva aislamiento por nodo."

    - name: Validar disponibilidad de OpenSSL
      ansible.builtin.command:
        argv:
          - openssl
          - version
      register: tls_openssl_version
      changed_when: false

    - name: Consultar archivos fuente y calcular SHA-256
      ansible.builtin.stat:
        path: "{{ item.source_path }}"
        checksum_algorithm: sha256
      loop: "{{ mongo_tls_secret_specs }}"
      loop_control:
        label: "{{ item.name }}"
      register: tls_source_stats
      no_log: true

    - name: Validar archivos regulares y permisos
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.checksum | length == 64
          - item.stat.mode == ('0644' if item.item.role == 'ca' else '0600')
        fail_msg: >-
          Falta un artefacto TLS, no es regular o tiene permisos inseguros.
          La CA requiere 0644 y los PEM privados 0600.
      loop: "{{ tls_source_stats.results }}"
      no_log: true

    - name: Validar que la fuente CA contiene solo un certificado
      ansible.builtin.command:
        argv:
          - openssl
          - storeutl
          - -noout
          - "{{ mongo_tls_ca_cert_path }}"
      register: tls_ca_store_objects
      changed_when: false

    - name: Comprobar estructura exclusiva de la CA publica
      ansible.builtin.assert:
        that:
          - "tls_ca_store_objects.stdout_lines == ['0: Certificate', 'Total found: 1']"
        fail_msg: "La fuente CA debe contener un unico certificado y ningun material privado."

    - name: Validar certificado Root CA parseable
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ mongo_tls_ca_cert_path }}"
          - -noout
      changed_when: false

    - name: Validar cadena autoemitida de la Root CA
      ansible.builtin.command:
        argv:
          - openssl
          - verify
          - -CAfile
          - "{{ mongo_tls_ca_cert_path }}"
          - "{{ mongo_tls_ca_cert_path }}"
      changed_when: false

    - name: Validar que cada PEM contiene solo private key y certificado
      ansible.builtin.command:
        argv:
          - openssl
          - storeutl
          - -noout
          - "{{ item.source_path }}"
      loop: "{{ mongo_tls_secret_specs | selectattr('role', 'equalto', 'node') | list }}"
      loop_control:
        label: "{{ item.node }}"
      register: tls_node_store_objects
      changed_when: false
      no_log: true

    - name: Comprobar estructura exclusiva de cada PEM de nodo
      ansible.builtin.assert:
        that:
          - "item.stdout_lines == ['0: Pkey', '1: Certificate', 'Total found: 2']"
        fail_msg: "Un PEM de nodo no contiene exactamente private key y certificado."
      loop: "{{ tls_node_store_objects.results }}"
      no_log: true

    - name: Validar private key de cada PEM
      ansible.builtin.command:
        argv:
          - openssl
          - pkey
          - -in
          - "{{ item.source_path }}"
          - -check
          - -noout
      loop: "{{ mongo_tls_secret_specs | selectattr('role', 'equalto', 'node') | list }}"
      loop_control:
        label: "{{ item.node }}"
      changed_when: false
      no_log: true

    - name: Obtener clave publica privada de cada PEM
      ansible.builtin.command:
        argv:
          - openssl
          - pkey
          - -in
          - "{{ item.source_path }}"
          - -pubout
      loop: "{{ mongo_tls_secret_specs | selectattr('role', 'equalto', 'node') | list }}"
      loop_control:
        label: "{{ item.node }}"
      register: tls_node_private_public_keys
      changed_when: false
      no_log: true

    - name: Obtener clave publica del certificado de cada PEM
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ item.source_path }}"
          - -pubkey
          - -noout
      loop: "{{ mongo_tls_secret_specs | selectattr('role', 'equalto', 'node') | list }}"
      loop_control:
        label: "{{ item.node }}"
      register: tls_node_certificate_public_keys
      changed_when: false
      no_log: true

    - name: Validar match key y certificate por nodo
      ansible.builtin.assert:
        that:
          - item.stdout == tls_node_certificate_public_keys.results[node_index].stdout
        fail_msg: "La private key no corresponde al certificado del nodo."
      loop: "{{ tls_node_private_public_keys.results }}"
      loop_control:
        index_var: node_index
      no_log: true

    - name: Validar cadena de cada PEM con la CA
      ansible.builtin.command:
        argv:
          - openssl
          - verify
          - -CAfile
          - "{{ mongo_tls_ca_cert_path }}"
          - "{{ item.source_path }}"
      loop: "{{ mongo_tls_secret_specs | selectattr('role', 'equalto', 'node') | list }}"
      loop_control:
        label: "{{ item.node }}"
      changed_when: false
      no_log: true

    - name: Construir identidades inmutables de Secrets
      ansible.builtin.set_fact:
        tls_secret_identities: >-
          {{
            (tls_secret_identities | default([]))
            + [item.item | combine({'sha256': item.stat.checksum, 'labels': secret_labels})]
          }}
      vars:
        secret_labels: >-
          {{
            {
              'tls.managed_by': 'ansible',
              'tls.environment': environment_name,
              'tls.role': item.item.role,
              'tls.version': item.item.version,
              'tls.sha256': item.stat.checksum,
              'tls.replica_set': mongo_replica_set
            }
            | combine({'tls.node': item.item.node} if item.item.role == 'node' else {})
          }}
      loop: "{{ tls_source_stats.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      no_log: true

    - name: Consultar estado de Docker Swarm
      ansible.builtin.command:
        argv:
          - docker
          - info
          - --format
          - "{{ '{{json .Swarm}}' }}"
      register: tls_swarm_info
      changed_when: false

    - name: Validar Swarm activo y capacidad de administrador
      ansible.builtin.assert:
        that:
          - (tls_swarm_info.stdout | from_json).LocalNodeState == 'active'
          - (tls_swarm_info.stdout | from_json).ControlAvailable | bool
        fail_msg: >-
          Docker Swarm debe estar activo y este nodo debe ser manager. No se
          iniciara ni modificara Swarm automaticamente.

    - name: Inspeccionar servicios MongoDB antes de crear Secrets
      ansible.builtin.command:
        argv:
          - docker
          - service
          - inspect
          - "{{ item }}"
      loop: "{{ mongo_tls_service_names }}"
      register: tls_services_before
      changed_when: false

    - name: Validar ausencia de referencias TLS activas antes de crear
      ansible.builtin.assert:
        that:
          - >-
            (((item.stdout | from_json | first).Spec.TaskTemplate.ContainerSpec.Secrets
            | default([]) | map(attribute='SecretName') | list)
            | intersect(tls_secret_identities | map(attribute='name') | list)
            | length) == 0
        fail_msg: >-
          El servicio {{ item.item }} ya referencia un Secret TLS de esta etapa.
          No se modificara el servicio.
      loop: "{{ tls_services_before.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Listar Docker Secrets existentes
      ansible.builtin.command:
        argv:
          - docker
          - secret
          - ls
          - --format
          - "{{ '{{.Name}}' }}"
      register: tls_existing_secret_names
      changed_when: false

    - name: Inspeccionar identidades de Secrets TLS existentes
      ansible.builtin.command:
        argv:
          - docker
          - secret
          - inspect
          - "{{ item.name }}"
      when: item.name in tls_existing_secret_names.stdout_lines
      loop: "{{ tls_secret_identities }}"
      loop_control:
        label: "{{ item.name }}"
      register: tls_existing_secret_inspections
      changed_when: false

    - name: Rechazar Secrets existentes con identidad distinta
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json | first).Spec.Name == item.item.name
          - ((item.stdout | from_json | first).Spec.Labels | default({})) == item.item.labels
        fail_msg: >-
          El Secret inmutable {{ item.item.name }} existe pero sus labels no
          demuestran la identidad esperada. Use una nueva version; no se borrara
          ni reemplazara automaticamente.
      when: not (item.skipped | default(false))
      loop: "{{ tls_existing_secret_inspections.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Crear unicamente Docker Secrets TLS faltantes
      ansible.builtin.command:
        argv: >-
          {{
            ['docker', 'secret', 'create',
             '--label', 'tls.managed_by=' ~ item.labels['tls.managed_by'],
             '--label', 'tls.environment=' ~ item.labels['tls.environment'],
             '--label', 'tls.role=' ~ item.labels['tls.role'],
             '--label', 'tls.version=' ~ item.labels['tls.version'],
             '--label', 'tls.sha256=' ~ item.labels['tls.sha256'],
             '--label', 'tls.replica_set=' ~ item.labels['tls.replica_set']]
            + (['--label', 'tls.node=' ~ item.labels['tls.node']] if item.role == 'node' else [])
            + [item.name, '-']
          }}
        stdin: "{{ lookup('ansible.builtin.file', item.source_path, rstrip=false) }}"
        stdin_add_newline: false
      when: item.name not in tls_existing_secret_names.stdout_lines
      loop: "{{ tls_secret_identities }}"
      loop_control:
        label: "{{ item.name }}"
      register: tls_secret_creations
      no_log: true

    - name: Listar Docker Secrets tras la convergencia
      ansible.builtin.command:
        argv:
          - docker
          - secret
          - ls
          - --format
          - "{{ '{{.Name}}' }}"
      register: tls_final_secret_names
      changed_when: false

    - name: Validar existencia exacta de los cuatro nombres esperados
      ansible.builtin.assert:
        that:
          - (tls_secret_identities | map(attribute='name') | list | difference(tls_final_secret_names.stdout_lines)) | length == 0
        fail_msg: "No estan disponibles los cuatro Docker Secrets TLS esperados."

    - name: Inspeccionar labels finales de Docker Secrets TLS
      ansible.builtin.command:
        argv:
          - docker
          - secret
          - inspect
          - "{{ item.name }}"
      loop: "{{ tls_secret_identities }}"
      loop_control:
        label: "{{ item.name }}"
      register: tls_final_secret_inspections
      changed_when: false

    - name: Validar labels y fingerprints finales
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json | first).Spec.Name == item.item.name
          - ((item.stdout | from_json | first).Spec.Labels | default({})) == item.item.labels
        fail_msg: "La identidad final de {{ item.item.name }} no coincide."
      loop: "{{ tls_final_secret_inspections.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Inspeccionar servicios MongoDB despues de crear Secrets
      ansible.builtin.command:
        argv:
          - docker
          - service
          - inspect
          - "{{ item }}"
      loop: "{{ mongo_tls_service_names }}"
      register: tls_services_after
      changed_when: false

    - name: Confirmar servicios sin cambios ni referencias TLS
      ansible.builtin.assert:
        that:
          - (item.stdout | from_json | first).Version.Index == (tls_services_before.results[service_index].stdout | from_json | first).Version.Index
          - >-
            (((item.stdout | from_json | first).Spec.TaskTemplate.ContainerSpec.Secrets
            | default([]) | map(attribute='SecretName') | list)
            | intersect(tls_secret_identities | map(attribute='name') | list)
            | length) == 0
        fail_msg: >-
          El servicio {{ item.item }} cambio o adquirio una referencia TLS
          inesperada. Este playbook no intentara corregirlo.
      loop: "{{ tls_services_after.results }}"
      loop_control:
        label: "{{ item.item }}"
        index_var: service_index

    - name: Mostrar resumen sin contenido sensible
      ansible.builtin.debug:
        msg:
          secret: "{{ item.name }}"
          sha256: "{{ item.sha256 }}"
          labels: "{{ item.labels }}"
          active_service_reference: false
      loop: "{{ tls_secret_identities }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Mostrar estado final de la etapa
      ansible.builtin.debug:
        msg:
          openssl: "{{ tls_openssl_version.stdout }}"
          environment: "{{ environment_name }}"
          tls_enabled: "{{ mongo_tls_enabled }}"
          tls_clients_enabled: "{{ mongo_tls_clients_enabled }}"
          tls_deployment_mode: "{{ mongo_tls_deployment_mode }}"
          future_secret_map: "{{ mongo_tls_future_secret_map }}"
          result: "DOCKER SECRETS TLS PREPARADOS; SERVICIOS SIN MODIFICAR"
