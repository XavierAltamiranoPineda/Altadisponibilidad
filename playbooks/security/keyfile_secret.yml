---
- name: Crear Docker Secret para MongoDB
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    mongo_keyfile: "{{ playbook_dir }}/../../secrets/mongo-keyfile"
    mongo_secret: "mongo_keyfile"

  tasks:

    # ==========================================================
    # 1. ENCABEZADO
    # ==========================================================

    - name: Mostrar encabezado
      ansible.builtin.debug:
        msg:
          - ""
          - "============================================================"
          - "        DOCKER SECRET - MONGODB V2"
          - "============================================================"
          - ""
          - "Secret: {{ mongo_secret }}"
          - ""

    # ==========================================================
    # 2. VERIFICAR SWARM
    # ==========================================================

    - name: Verificar estado de Swarm
      ansible.builtin.command:
        cmd: docker info --format "{{ '{{.Swarm.LocalNodeState}}' }}"
      register: swarm_state
      changed_when: false

    - name: Validar Swarm activo
      ansible.builtin.assert:
        that:
          - swarm_state.stdout | trim == "active"
        fail_msg: "Docker Swarm no está activo."
        success_msg: "Docker Swarm está activo."

    # ==========================================================
    # 3. VERIFICAR KEYFILE
    # ==========================================================

    - name: Verificar existencia del keyfile
      ansible.builtin.stat:
        path: "{{ mongo_keyfile }}"
      register: keyfile_info

    - name: Validar keyfile
      ansible.builtin.assert:
        that:
          - keyfile_info.stat.exists
          - keyfile_info.stat.isreg
        fail_msg: "No existe el keyfile: {{ mongo_keyfile }}"
        success_msg: "Keyfile encontrado."

    # ==========================================================
    # 4. VERIFICAR SI EL SECRET YA EXISTE
    # ==========================================================

    - name: Consultar Docker Secrets
      ansible.builtin.command:
        cmd: docker secret ls --format "{{ '{{.Name}}' }}"
      register: existing_secrets
      changed_when: false

    # ==========================================================
    # 5. CREAR SECRET
    # ==========================================================

    - name: Crear secret MongoDB
      ansible.builtin.command:
        cmd: >
          docker secret create
          {{ mongo_secret }}
          {{ mongo_keyfile }}
      when: mongo_secret not in existing_secrets.stdout_lines
      register: secret_created
      no_log: true

    # ==========================================================
    # 6. MOSTRAR RESULTADO
    # ==========================================================

    - name: Mostrar resultado
      ansible.builtin.debug:
        msg:
          - ""
          - "============================================================"
          - "        RESULTADO DOCKER SECRET"
          - "============================================================"
          - ""
          - "[OK] Docker Swarm activo"
          - "[OK] Keyfile encontrado"
          - "[OK] Secret MongoDB disponible"
          - "Secret: {{ mongo_secret }}"
          - "Destino dentro del contenedor:"
          - "/run/secrets/{{ mongo_secret }}"
          - ""
          - "============================================================"
