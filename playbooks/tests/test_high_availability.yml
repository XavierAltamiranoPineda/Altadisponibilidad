---
- name: Prueba de Alta Disponibilidad y Failover MongoDB V2 (TLS)
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/common.yml"
    - "{{ playbook_dir }}/../../vars/{{ target_environment | default('local') }}.yml"
    - "{{ playbook_dir }}/../../vars/vault_mongodb.yml"

  vars:
    mongo_network: "mongo_swarm_net"
    test_database: "prueba_ha"
    test_collection: "datos_failover"

  tasks:

    - name: Validar existencia de certificado CA publico
      ansible.builtin.stat:
        path: "{{ mongo_tls_ca_cert_path }}"
      register: mongo_ca_stat

    - name: Exigir certificado CA publico
      ansible.builtin.assert:
        that:
          - mongo_ca_stat.stat.exists
          - mongo_ca_stat.stat.isreg
        fail_msg: "[ERROR] Certificado CA no encontrado: {{ mongo_tls_ca_cert_path }}"
        success_msg: "[OK] Certificado CA verificado en el host"

    # ============================================================
    # 1. DETECTAR PRIMARY INICIAL
    # ============================================================

    - name: Detectar PRIMARY inicial via TLS
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            const user = process.env.MONGO_ADMIN_USER;
            const pass = process.env.MONGO_ADMIN_PASSWORD;
            const uri = `mongodb://mongo1:27017,mongo2:27018,mongo3:27019/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
            const db = connect(uri);
            db.auth(user, pass);
            print("PRIMARY=" + db.hello().primary);
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: initial_primary_raw
      changed_when: false
      no_log: true

    - name: Interpretar PRIMARY inicial
      ansible.builtin.set_fact:
        initial_primary: "{{ initial_primary_raw.stdout_lines | select('match', '^PRIMARY=') | first | regex_replace('^PRIMARY=', '') }}"

    - name: Mostrar PRIMARY inicial
      ansible.builtin.debug:
        msg: "PRIMARY inicial: {{ initial_primary }}"

    - name: Exigir que mongo1 sea el PRIMARY inicial
      ansible.builtin.assert:
        that:
          - initial_primary == "mongo1:27017"
        fail_msg: "ERROR: mongo1 no es el PRIMARY inicial. Ejecute configure_priorities.yml primero."
        success_msg: "OK: mongo1 es el PRIMARY inicial."

    # ============================================================
    # 2. SIMULAR FALLA DE MONGO1 MEDIANTE SCALE=0
    # ============================================================

    - name: Detener mongo1 mediante scale=0
      ansible.builtin.command:
        cmd: docker service scale mongo1=0
      register: scale_down
      changed_when: true

    - name: Esperar que el contenedor mongo1 desaparezca
      ansible.builtin.shell:
        cmd: docker ps -q --filter "label=com.docker.swarm.service.name=mongo1"
      register: mongo1_running
      retries: 30
      delay: 2
      until: mongo1_running.stdout | trim == ""
      changed_when: false

    # ============================================================
    # 3. ESPERAR Y VALIDAR FAILOVER
    # ============================================================

    - name: Esperar que un SECONDARY asuma como nuevo PRIMARY
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            try {
              const user = process.env.MONGO_ADMIN_USER;
              const pass = process.env.MONGO_ADMIN_PASSWORD;
              const uri = `mongodb://mongo2:27018,mongo3:27019/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
              const db = connect(uri);
              db.auth(user, pass);
              const p = db.hello().primary;
              print("FAILOVER_PRIMARY=" + (p || "none"));
            } catch(e) {
              print("FAILOVER_PRIMARY=none");
            }
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: failover_primary_raw
      retries: 40
      delay: 3
      until:
        - failover_primary_raw.rc == 0
        - "'FAILOVER_PRIMARY=mongo2:27018' in failover_primary_raw.stdout or 'FAILOVER_PRIMARY=mongo3:27019' in failover_primary_raw.stdout"
      changed_when: false
      no_log: true

    - name: Interpretar nuevo PRIMARY durante failover
      ansible.builtin.set_fact:
        failover_primary: "{{ failover_primary_raw.stdout_lines | select('match', '^FAILOVER_PRIMARY=') | first | regex_replace('^FAILOVER_PRIMARY=', '') }}"

    - name: Mostrar nuevo PRIMARY
      ansible.builtin.debug:
        msg: "Nuevo PRIMARY durante falla: {{ failover_primary }}"

    # ============================================================
    # 4. ESCRIBIR DATOS DURANTE LA FALLA
    # ============================================================

    - name: Insertar documento durante failover via TLS
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            const user = process.env.MONGO_ADMIN_USER;
            const pass = process.env.MONGO_ADMIN_PASSWORD;
            const uri = `mongodb://mongo2:27018,mongo3:27019/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
            const db = connect(uri);
            db.auth(user, pass);
            const res = db.getSiblingDB('{{ test_database }}').{{ test_collection }}.insertOne({
              prueba: 'escritura_durante_failover',
              fecha: new Date(),
              nodo_escritura: '{{ failover_primary }}',
              estado: 'CREADO_DURANTE_FAILOVER'
            });
            if (!res.acknowledged) quit(1);
            print("WRITE_FAILOVER_OK");
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: write_during_failover
      changed_when: true
      no_log: true

    # ============================================================
    # 5. RECUPERAR MONGO1 MEDIANTE SCALE=1
    # ============================================================

    - name: Recuperar mongo1 mediante scale=1
      ansible.builtin.command:
        cmd: docker service scale mongo1=1
      register: scale_up
      changed_when: true

    # ============================================================
    # 6. ESPERAR QUE MONGO1 REGRESE Y SINCRONICE
    # ============================================================

    - name: Esperar salud completa del cluster
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            try {
              const user = process.env.MONGO_ADMIN_USER;
              const pass = process.env.MONGO_ADMIN_PASSWORD;
              const uri = `mongodb://mongo1:27017,mongo2:27018,mongo3:27019/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
              const db = connect(uri);
              db.auth(user, pass);
              const rs = db.adminCommand({replSetGetStatus: 1});
              const m1 = rs.members.find(m => m.name === 'mongo1:27017');
              print("M1_HEALTH=" + (m1 ? m1.health : 0));
            } catch(e) {
              print("M1_HEALTH=0");
            }
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: mongo1_health_raw
      retries: 40
      delay: 3
      until:
        - mongo1_health_raw.rc == 0
        - "'M1_HEALTH=1' in mongo1_health_raw.stdout"
      changed_when: false
      no_log: true

    - name: Esperar documento sincronizado hacia mongo1 (lectura secundaria)
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            try {
              const user = process.env.MONGO_ADMIN_USER;
              const pass = process.env.MONGO_ADMIN_PASSWORD;
              const uri = `mongodb://mongo1:27017/admin?directConnection=true&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
              const db = connect(uri);
              db.auth(user, pass);
              db.getMongo().setReadPref('secondaryPreferred');
              const count = db.getSiblingDB('{{ test_database }}').{{ test_collection }}.countDocuments({
                prueba: 'escritura_durante_failover',
                estado: 'CREADO_DURANTE_FAILOVER'
              });
              print("SYNC_COUNT=" + count);
            } catch(e) {
              print("SYNC_COUNT=0");
            }
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: sync_raw
      retries: 40
      delay: 3
      until:
        - sync_raw.rc == 0
        - "'SYNC_COUNT=1' in sync_raw.stdout"
      changed_when: false
      no_log: true

    - name: Validar documento sincronizado
      ansible.builtin.assert:
        that:
          - "'SYNC_COUNT=1' in sync_raw.stdout"
        fail_msg: "ERROR: El documento no fue sincronizado hacia mongo1."
        success_msg: "OK: Documento sincronizado correctamente hacia mongo1."

    # ============================================================
    # 7. ESPERAR FAILBACK POR PRIORIDAD
    # ============================================================

    - name: Esperar que mongo1 recupere PRIMARY por prioridad
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            try {
              const user = process.env.MONGO_ADMIN_USER;
              const pass = process.env.MONGO_ADMIN_PASSWORD;
              const uri = `mongodb://mongo1:27017,mongo2:27018,mongo3:27019/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
              const db = connect(uri);
              db.auth(user, pass);
              print("FINAL_PRIMARY=" + db.hello().primary);
            } catch(e) {
              print("FINAL_PRIMARY=none");
            }
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: final_primary_raw
      retries: 80
      delay: 3
      until:
        - final_primary_raw.rc == 0
        - "'FINAL_PRIMARY=mongo1:27017' in final_primary_raw.stdout"
      changed_when: false
      no_log: true

    # ============================================================
    # 8. ESTADO FINAL
    # ============================================================

    - name: Obtener estado final del Replica Set
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            const user = process.env.MONGO_ADMIN_USER;
            const pass = process.env.MONGO_ADMIN_PASSWORD;
            const uri = `mongodb://mongo1:27017,mongo2:27018,mongo3:27019/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
            const db = connect(uri);
            db.auth(user, pass);
            const rs = db.adminCommand({replSetGetStatus: 1});
            print("FINAL_STATUS=" + rs.members.map(m => m.name + ' | ' + m.stateStr + ' | health=' + m.health).join(';'));
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: final_status_raw
      changed_when: false
      no_log: true

    - name: Interpretar estado final
      ansible.builtin.set_fact:
        final_status: "{{ final_status_raw.stdout_lines | select('match', '^FINAL_STATUS=') | first | regex_replace('^FINAL_STATUS=', '') }}"

    - name: Validar estado final
      ansible.builtin.assert:
        that:
          - "'mongo1:27017 | PRIMARY | health=1' in final_status"
          - "'mongo2:27018 | SECONDARY | health=1' in final_status"
          - "'mongo3:27019 | SECONDARY | health=1' in final_status"
        fail_msg: "ERROR: El Replica Set no termino en el estado esperado."
        success_msg: "OK: Replica Set recuperado completamente."

    # ============================================================
    # 9. RESULTADO FINAL
    # ============================================================

    - name: Resultado final
      ansible.builtin.debug:
        msg:
          - ""
          - "============================================================"
          - "PRUEBA COMPLETA DE ALTA DISPONIBILIDAD MONGODB V2 (TLS)"
          - "============================================================"
          - ""
          - "[OK] PRIMARY inicial: {{ initial_primary }}"
          - "[OK] mongo1 detenido mediante scale=0"
          - "[OK] Failover automatico realizado"
          - "[OK] PRIMARY durante falla: {{ failover_primary }}"
          - "[OK] Escritura realizada durante la falla sobre TLS"
          - "[OK] mongo1 recuperado mediante scale=1"
          - "[OK] Documento sincronizado hacia mongo1"
          - "[OK] mongo1 recupero PRIMARY por prioridad"
          - "[OK] PRIMARY final: mongo1:27017"
          - ""
          - "Estado final:"
          - "{{ final_status }}"
          - ""
          - "============================================================"
          - "REPLICACION + FAILOVER + FAILBACK VALIDADOS (TLS)"
          - "============================================================"
