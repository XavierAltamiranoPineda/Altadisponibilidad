---
- name: Eliminar solamente base prueba_ha (TLS)
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/common.yml"
    - "{{ playbook_dir }}/../../vars/{{ target_environment | default('local') }}.yml"
    - "{{ playbook_dir }}/../../vars/vault_mongodb.yml"

  vars:
    mongo_network: "mongo_swarm_net"
    test_database: "prueba_ha"

  tasks:

    - name: Validar existencia de certificado CA publico
      ansible.builtin.stat:
        path: "{{ mongo_tls_ca_cert_path }}"
      register: mongo_ca_stat

    - name: Exigir certificado CA publico
      ansible.builtin.assert:
        that:
          - mongo_ca_stat.stat.exists
          - mongo_ca_stat.stat.isreg
        fail_msg: "[ERROR] Certificado CA no encontrado: {{ mongo_tls_ca_cert_path }}"
        success_msg: "[OK] Certificado CA verificado en el host"

    - name: Eliminar base prueba_ha via conexion TLS al Replica Set
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            const user = process.env.MONGO_ADMIN_USER;
            const pass = process.env.MONGO_ADMIN_PASSWORD;
            const uri = `mongodb://mongo1:27017,mongo2:27017,mongo3:27017/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
            const db = connect(uri);
            db.auth(user, pass);
            const dropRes = db.getSiblingDB('{{ test_database }}').dropDatabase();
            const listRes = db.adminCommand({listDatabases: 1}).databases.map(d => d.name);
            print("CLEANUP_JSON=" + JSON.stringify({
              dropped: dropRes.ok === 1,
              databases: listRes,
              primary: db.hello().primary
            }));
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: cleanup_raw
      changed_when: true
      no_log: true

    - name: Interpretar resultado de limpieza
      ansible.builtin.set_fact:
        cleanup_info: >-
          {{
            (cleanup_raw.stdout_lines
             | select('match', '^CLEANUP_JSON=') | first
             | regex_replace('^CLEANUP_JSON=', ''))
            | from_json
          }}
      no_log: true

    - name: Validar eliminacion de prueba_ha
      ansible.builtin.assert:
        that:
          - cleanup_info.dropped | bool
          - "'prueba_ha' not in cleanup_info.databases"
        fail_msg: "ERROR: No fue posible eliminar prueba_ha sobre TLS."
        success_msg: "OK: Base prueba_ha eliminada correctamente."

    - name: Resultado final
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "LIMPIEZA DE DATOS DE PRUEBA COMPLETADA (TLS)"
          - "============================================================"
          - "[OK] Base eliminada: prueba_ha"
          - "[OK] PRIMARY utilizado: {{ cleanup_info.primary }}"
          - "[OK] admin conservada"
          - "[OK] config conservada"
          - "[OK] local conservada"
          - "[OK] Conexion ejecutada sobre TLS con validacion de CA"
          - "============================================================"
