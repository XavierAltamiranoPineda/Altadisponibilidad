---
- name: Reset completo del entorno MongoDB V2 local
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/common.yml"
    - "{{ playbook_dir }}/../../vars/local.yml"

  vars:
    mongo_services:
      - mongo1
      - mongo2
      - mongo3

    mongo_data_volumes:
      - mongo1_data
      - mongo2_data
      - mongo3_data

    mongo_tls_control_volumes:
      - mongo1_tls_control
      - mongo2_tls_control
      - mongo3_tls_control

    mongo_secret: "mongo_keyfile"

    tls_runtime_artifacts:
      - "{{ playbook_dir }}/../../logs/tls_rollout_state.json"
      - "{{ playbook_dir }}/../../logs/tls_update_spec_mongo1.json"
      - "{{ playbook_dir }}/../../logs/tls_update_spec_mongo2.json"
      - "{{ playbook_dir }}/../../logs/tls_update_spec_mongo3.json"

  tasks:

    # ============================================================
    # 1. ELIMINAR SERVICIOS MONGODB V2
    # ============================================================

    - name: Verificar servicios MongoDB existentes
      ansible.builtin.command:
        cmd: "docker service inspect {{ item }}"
      loop: "{{ mongo_services }}"
      register: service_checks
      changed_when: false
      failed_when: false

    - name: Eliminar servicios MongoDB existentes
      ansible.builtin.command:
        cmd: "docker service rm {{ item.item }}"
      loop: "{{ service_checks.results }}"
      when: item.rc == 0
      changed_when: true

    # ============================================================
    # 2. ESPERAR QUE SWARM ELIMINE LOS SERVICIOS
    # ============================================================

    - name: Esperar eliminacion completa de servicios
      ansible.builtin.command:
        cmd: "docker service inspect {{ item }}"
      loop: "{{ mongo_services }}"
      register: removed_services
      retries: 30
      delay: 2
      until: removed_services.rc != 0
      changed_when: false
      failed_when: false

    - name: Mostrar servicios eliminados
      ansible.builtin.debug:
        msg: "[OK] Servicios mongo1, mongo2 y mongo3 eliminados."

    # ============================================================
    # 3. ESPERAR LIMPIEZA DE TAREAS DE SWARM
    # ============================================================

    - name: Esperar liberacion inicial de contenedores Swarm
      ansible.builtin.pause:
        seconds: 5

    - name: Buscar contenedores que usan volumenes MongoDB V2
      ansible.builtin.shell:
        cmd: |
          docker ps -aq --filter "volume={{ item }}"
      loop: "{{ mongo_data_volumes + mongo_tls_control_volumes }}"
      register: volume_containers
      changed_when: false

    # ============================================================
    # 4. ELIMINAR CONTENEDORES ANTIGUOS
    # ============================================================

    - name: Eliminar contenedores antiguos asociados a volumenes V2
      ansible.builtin.shell:
        cmd: |
          CONTAINERS=$(docker ps -aq --filter "volume={{ item }}")

          if [ -n "$CONTAINERS" ]; then
            docker rm -f $CONTAINERS
          fi
      loop: "{{ mongo_data_volumes + mongo_tls_control_volumes }}"
      register: container_cleanup
      changed_when: container_cleanup.stdout | trim != ""
      failed_when: false

    - name: Esperar que los volumenes queden libres
      ansible.builtin.shell:
        cmd: |
          docker ps -aq --filter "volume={{ item }}"
      loop: "{{ mongo_data_volumes + mongo_tls_control_volumes }}"
      register: volume_usage
      retries: 30
      delay: 2
      until: volume_usage.stdout | trim == ""
      changed_when: false

    - name: Mostrar limpieza de contenedores
      ansible.builtin.debug:
        msg: "[OK] Contenedores/tareas antiguas MongoDB V2 eliminados."

    # ============================================================
    # 5. ELIMINAR VOLUMENES DE DATOS Y DE CONTROL TLS
    # ============================================================

    - name: Verificar volumenes de datos y de control TLS
      ansible.builtin.command:
        cmd: "docker volume inspect {{ item }}"
      loop: "{{ mongo_data_volumes + mongo_tls_control_volumes }}"
      register: volume_checks
      changed_when: false
      failed_when: false

    - name: Eliminar volumenes existentes (datos y control TLS)
      ansible.builtin.command:
        cmd: "docker volume rm {{ item.item }}"
      loop: "{{ volume_checks.results }}"
      when: item.rc == 0
      register: volume_remove
      changed_when: true

    # ============================================================
    # 6. ELIMINAR SECRET MONGO_KEYFILE
    # ============================================================

    - name: Verificar secret mongo_keyfile
      ansible.builtin.command:
        cmd: "docker secret inspect {{ mongo_secret }}"
      register: secret_check
      changed_when: false
      failed_when: false

    - name: Eliminar secret mongo_keyfile
      ansible.builtin.command:
        cmd: "docker secret rm {{ mongo_secret }}"
      when: secret_check.rc == 0
      changed_when: true

    # ============================================================
    # 7. LIMPIAR ARTEFACTOS RUNTIME DEL ROLLOUT TLS
    # ============================================================

    - name: Eliminar state files operacionales del rollout TLS si existen
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ tls_runtime_artifacts }}"

    # ============================================================
    # 8. SINCRONIZAR VARS/LOCAL.YML AL ESTADO BOOTSTRAP
    # ============================================================

    - name: Restaurar mongo_tls_enabled=false en vars/local.yml
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../../vars/local.yml"
        regexp: '^mongo_tls_enabled:'
        line: 'mongo_tls_enabled: false'

    - name: Restaurar mongo_tls_clients_enabled=false en vars/local.yml
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../../vars/local.yml"
        regexp: '^mongo_tls_clients_enabled:'
        line: 'mongo_tls_clients_enabled: false'

    - name: Restaurar mongo_tls_target_mode=requireTLS en vars/local.yml
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../../vars/local.yml"
        regexp: '^mongo_tls_target_mode:'
        line: 'mongo_tls_target_mode: "requireTLS"'

    - name: Restaurar mongo_tls_deployment_mode=disabled en vars/local.yml
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../../vars/local.yml"
        regexp: '^mongo_tls_deployment_mode:'
        line: 'mongo_tls_deployment_mode: "disabled"'

    - name: Restaurar mongo_backup_uri con tls=true en vars/local.yml
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../../vars/local.yml"
        regexp: '^mongo_backup_uri:'
        line: 'mongo_backup_uri: "mongodb://mongo1:27017,mongo2:27018,mongo3:27019/?replicaSet=rs0&tls=true"'

    # ============================================================
    # 9. VALIDAR LIMPIEZA TOTAL
    # ============================================================

    - name: Validar servicios eliminados
      ansible.builtin.shell:
        cmd: |
          docker service ls --format '{{ "{{.Name}}" }}' \
          | grep -E '^(mongo1|mongo2|mongo3)$' || true
      register: final_services
      changed_when: false

    - name: Validar volumenes de datos eliminados
      ansible.builtin.shell:
        cmd: |
          docker volume ls --format '{{ "{{.Name}}" }}' \
          | grep -E '^(mongo1_data|mongo2_data|mongo3_data)$' || true
      register: final_data_volumes
      changed_when: false

    - name: Validar volumenes de control TLS eliminados
      ansible.builtin.shell:
        cmd: |
          docker volume ls --format '{{ "{{.Name}}" }}' \
          | grep -E '^(mongo1_tls_control|mongo2_tls_control|mongo3_tls_control)$' || true
      register: final_tls_volumes
      changed_when: false

    - name: Validar secret mongo_keyfile eliminado
      ansible.builtin.shell:
        cmd: |
          docker secret ls --format '{{ "{{.Name}}" }}' \
          | grep '^mongo_keyfile$' || true
      register: final_secret
      changed_when: false

    - name: Validar contenido final de vars/local.yml
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../../vars/local.yml"
      register: local_yml_content

    - name: Interpretar variables de vars/local.yml
      ansible.builtin.set_fact:
        local_vars: "{{ (local_yml_content.content | b64decode) | from_yaml }}"

    - name: Validar resultado del reset
      ansible.builtin.assert:
        that:
          - final_services.stdout | trim == ""
          - final_data_volumes.stdout | trim == ""
          - final_tls_volumes.stdout | trim == ""
          - final_secret.stdout | trim == ""
          - not (local_vars.mongo_tls_enabled | bool)
          - not (local_vars.mongo_tls_clients_enabled | bool)
          - local_vars.mongo_tls_target_mode == 'requireTLS'
          - local_vars.mongo_tls_deployment_mode == 'disabled'
        fail_msg: "ERROR: El reset del entorno no cumplio con todos los criterios de limpieza y estado bootstrap."
        success_msg: "OK: Entorno MongoDB V2 y estado local restaurados al estado bootstrap limpio."

    # ============================================================
    # 10. RESULTADO FINAL
    # ============================================================

    - name: Resultado final
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "RESET LOCAL MONGODB V2 COMPLETADO"
          - "============================================================"
          - "[OK] mongo1, mongo2, mongo3 eliminados"
          - "[OK] mongo1_data, mongo2_data, mongo3_data eliminados"
          - "[OK] mongo1_tls_control, mongo2_tls_control, mongo3_tls_control eliminados"
          - "[OK] mongo_keyfile eliminado"
          - "[OK] Artefactos de estado TLS en logs/ eliminados"
          - "[OK] vars/local.yml -> deployment_mode: disabled, tls_enabled: false"
          - "[OK] Docker Secrets TLS (PKI v1) CONSERVADOS"
          - "[OK] mongo_swarm_net CONSERVADA"
          - "[OK] Docker Swarm CONSERVADO"
          - "============================================================"
