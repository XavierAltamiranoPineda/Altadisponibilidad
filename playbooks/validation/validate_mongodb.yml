---
- name: Validacion Integral MongoDB V2 (TLS)
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/common.yml"
    - "{{ playbook_dir }}/../../vars/{{ target_environment | default('local') }}.yml"
    - "{{ playbook_dir }}/../../vars/vault_mongodb.yml"

  vars:
    mongo_network: "mongo_swarm_net"
    mongo_secret: "mongo_keyfile"

  tasks:

    # ============================================================
    # 1. VALIDAR DOCKER SWARM
    # ============================================================

    - name: Verificar Docker Swarm
      ansible.builtin.command:
        cmd: docker info --format "{{ '{{.Swarm.LocalNodeState}}' }}"
      register: swarm_state
      changed_when: false

    - name: Validar Docker Swarm activo
      ansible.builtin.assert:
        that:
          - swarm_state.stdout | trim == "active"
        fail_msg: "ERROR: Docker Swarm no esta activo."
        success_msg: "OK: Docker Swarm activo."

    # ============================================================
    # 2. VALIDAR RED
    # ============================================================

    - name: Verificar red MongoDB
      ansible.builtin.command:
        cmd: docker network inspect {{ mongo_network }}
      register: network_check
      changed_when: false
      failed_when: false

    - name: Validar red MongoDB
      ansible.builtin.assert:
        that:
          - network_check.rc == 0
        fail_msg: "ERROR: La red {{ mongo_network }} no existe."
        success_msg: "OK: Red {{ mongo_network }} disponible."

    # ============================================================
    # 3. VALIDAR SECRET
    # ============================================================

    - name: Verificar Docker Secret
      ansible.builtin.command:
        cmd: docker secret inspect {{ mongo_secret }}
      register: secret_check
      changed_when: false
      failed_when: false

    - name: Validar Docker Secret
      ansible.builtin.assert:
        that:
          - secret_check.rc == 0
        fail_msg: "ERROR: El secret {{ mongo_secret }} no existe."
        success_msg: "OK: Docker Secret {{ mongo_secret }} disponible."

    # ============================================================
    # 4. VALIDAR SERVICIOS
    # ============================================================

    - name: Consultar replicas de servicios MongoDB
      ansible.builtin.command:
        cmd: >
          docker service ls
          --filter name={{ item }}
          --format "{{ '{{.Replicas}}' }}"
      loop:
        - mongo1
        - mongo2
        - mongo3
      register: service_replicas
      changed_when: false

    - name: Validar servicios 1/1
      ansible.builtin.assert:
        that:
          - item.stdout | trim == "1/1"
        fail_msg: "ERROR: {{ item.item }} no tiene 1/1 replicas."
        success_msg: "OK: {{ item.item }} funcionando 1/1."
      loop: "{{ service_replicas.results }}"

    # ============================================================
    # 5. VALIDAR AUTENTICACION Y TOPOLOGIA VIA CLIENTE TLS
    # ============================================================

    - name: Validar existencia de certificado CA publico
      ansible.builtin.stat:
        path: "{{ mongo_tls_ca_cert_path }}"
      register: mongo_ca_stat

    - name: Exigir certificado CA publico
      ansible.builtin.assert:
        that:
          - mongo_ca_stat.stat.exists
          - mongo_ca_stat.stat.isreg
        fail_msg: "[ERROR] Certificado CA no encontrado: {{ mongo_tls_ca_cert_path }}"
        success_msg: "[OK] Certificado CA verificado en el host"

    - name: Validar autenticacion y topologia via TLS
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            const user = process.env.MONGO_ADMIN_USER;
            const pass = process.env.MONGO_ADMIN_PASSWORD;
            const uri = `mongodb://mongo1:27017,mongo2:27017,mongo3:27017/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
            try {
              const db = connect(uri);
              db.auth(user, pass);
              const conn = db.adminCommand({connectionStatus: 1});
              const rs = db.adminCommand({replSetGetStatus: 1});
              const authOk = conn.ok === 1 && conn.authInfo.authenticatedUsers.length > 0;
              print("VALIDATION_JSON=" + JSON.stringify({
                authOk: authOk,
                setName: rs.set,
                primary: (rs.members.find(m => m.stateStr === 'PRIMARY') || {}).name
              }));
            } catch(e) {
              print("VALIDATION_JSON=" + JSON.stringify({ error: e.message, authOk: false }));
            }
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: validation_diag_raw
      changed_when: false
      no_log: true

    - name: Interpretar diagnostico TLS
      ansible.builtin.set_fact:
        validation_diag: >-
          {{
            (validation_diag_raw.stdout_lines
             | select('match', '^VALIDATION_JSON=') | first
             | regex_replace('^VALIDATION_JSON=', ''))
            | from_json
          }}
      no_log: true

    - name: Confirmar autenticacion TLS
      ansible.builtin.assert:
        that:
          - validation_diag.authOk | bool
        fail_msg: "ERROR: La autenticacion MongoDB fallo sobre TLS."
        success_msg: "OK: Autenticacion MongoDB funcionando sobre TLS."

    - name: Confirmar Replica Set
      ansible.builtin.assert:
        that:
          - validation_diag.setName == mongo_replica_set
        fail_msg: "ERROR: Replica Set incorrecto."
        success_msg: "OK: Replica Set {{ mongo_replica_set }}."

    - name: Confirmar PRIMARY valido
      ansible.builtin.assert:
        that:
          - validation_diag.primary in ["mongo1:27017", "mongo2:27017", "mongo3:27017"]
        fail_msg: "ERROR: No se pudo detectar un PRIMARY valido."
        success_msg: "OK: PRIMARY detectado: {{ validation_diag.primary }}."

    # ============================================================
    # 6. VALIDAR RED DE LOS SERVICIOS
    # ============================================================

    - name: Obtener ID de red MongoDB
      ansible.builtin.command:
        cmd: >
          docker network inspect {{ mongo_network }}
          --format "{{ '{{.ID}}' }}"
      register: mongo_network_id
      changed_when: false

    - name: Validar red en servicios MongoDB
      ansible.builtin.command:
        cmd: >
          docker service inspect {{ item }}
          --format "{{ '{{json .Spec.TaskTemplate.Networks}}' }}"
      loop:
        - mongo1
        - mongo2
        - mongo3
      register: service_networks
      changed_when: false

    - name: Confirmar red MongoDB en servicios
      ansible.builtin.assert:
        that:
          - mongo_network_id.stdout | trim in item.stdout
        fail_msg: "ERROR: {{ item.item }} no esta conectado a {{ mongo_network }}."
        success_msg: "OK: {{ item.item }} conectado a {{ mongo_network }}."
      loop: "{{ service_networks.results }}"

    # ============================================================
    # 7. RESULTADO
    # ============================================================

    - name: Mostrar resultado final
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "VALIDACION GENERAL MONGODB V2 (TLS)"
          - "============================================================"
          - "[OK] Docker Swarm: ACTIVE"
          - "[OK] Red: {{ mongo_network }}"
          - "[OK] Docker Secret: {{ mongo_secret }}"
          - "[OK] mongo1: 1/1"
          - "[OK] mongo2: 1/1"
          - "[OK] mongo3: 1/1"
          - "[OK] Autenticacion TLS funcionando"
          - "[OK] Replica Set: {{ mongo_replica_set }}"
          - "[OK] PRIMARY actual: {{ validation_diag.primary }}"
          - "[OK] Servicios conectados a {{ mongo_network }}"
          - "============================================================"
          - "VALIDACION GENERAL EXITOSA"
          - "============================================================"
