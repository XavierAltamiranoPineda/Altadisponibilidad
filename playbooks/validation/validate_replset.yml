---
- name: Validar Replica Set MongoDB V2
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/vault_mongodb.yml"

  tasks:

    - name: Obtener contenedor mongo1
      shell: docker ps -q --filter name=mongo1
      register: mongo1_container
      changed_when: false

    - name: Validar contenedor mongo1
      assert:
        that:
          - mongo1_container.stdout | trim != ""
        fail_msg: "No se encontro el contenedor mongo1."
        success_msg: "OK: Contenedor mongo1 encontrado."

    - name: Probar autenticacion
      shell: >
        docker exec {{ mongo1_container.stdout | trim }}
        mongosh --quiet
        --username {{ mongo_admin_user }}
        --password {{ mongo_admin_password }}
        --authenticationDatabase admin
        --eval "db.adminCommand({connectionStatus:1}).ok"
      register: auth_test
      changed_when: false
      no_log: true

    - name: Validar autenticacion
      assert:
        that:
          - auth_test.stdout | trim == "1"
        fail_msg: "ERROR: La autenticacion fallo."
        success_msg: "OK: Autenticacion funcionando."

    - name: Consultar Replica Set
      shell: >
        docker exec {{ mongo1_container.stdout | trim }}
        mongosh --quiet
        --username {{ mongo_admin_user }}
        --password {{ mongo_admin_password }}
        --authenticationDatabase admin
        --eval "rs.status().set"
      register: replset_name
      changed_when: false
      no_log: true

    - name: Validar Replica Set
      assert:
        that:
          - replset_name.stdout | trim == "rs0"
        fail_msg: "ERROR: Replica Set incorrecto."
        success_msg: "OK: Replica Set rs0."

    - name: Consultar miembros
      shell: >
        docker exec {{ mongo1_container.stdout | trim }}
        mongosh --quiet
        --username {{ mongo_admin_user }}
        --password {{ mongo_admin_password }}
        --authenticationDatabase admin
        --eval "rs.status().members.map(m => m.name + ' | ' + m.stateStr + ' | health=' + m.health).join(';')"
      register: members
      changed_when: false
      no_log: true

    - name: Validar mongo1
      assert:
        that:
          - "'mongo1:27017' in members.stdout"
        fail_msg: "ERROR: mongo1 no esta presente."
        success_msg: "OK: mongo1 presente."

    - name: Validar mongo2
      assert:
        that:
          - "'mongo2:27017' in members.stdout"
        fail_msg: "ERROR: mongo2 no esta presente."
        success_msg: "OK: mongo2 presente."

    - name: Validar mongo3
      assert:
        that:
          - "'mongo3:27017' in members.stdout"
        fail_msg: "ERROR: mongo3 no esta presente."
        success_msg: "OK: mongo3 presente."

    - name: Consultar estados
      shell: >
        docker exec {{ mongo1_container.stdout | trim }}
        mongosh --quiet
        --username {{ mongo_admin_user }}
        --password {{ mongo_admin_password }}
        --authenticationDatabase admin
        --eval "rs.status().members.map(m => m.stateStr).join(',')"
      register: states
      changed_when: false
      no_log: true

    - name: Validar PRIMARY
      assert:
        that:
          - "'PRIMARY' in states.stdout"
        fail_msg: "ERROR: No existe PRIMARY."
        success_msg: "OK: PRIMARY encontrado."

    - name: Validar SECONDARY
      assert:
        that:
          - states.stdout.count('SECONDARY') == 2
        fail_msg: "ERROR: No existen dos SECONDARY."
        success_msg: "OK: Dos SECONDARY encontrados."

    - name: Consultar salud
      shell: >
        docker exec {{ mongo1_container.stdout | trim }}
        mongosh --quiet
        --username {{ mongo_admin_user }}
        --password {{ mongo_admin_password }}
        --authenticationDatabase admin
        --eval "rs.status().members.map(m => m.health).join(',')"
      register: health
      changed_when: false
      no_log: true

    - name: Validar salud
      assert:
        that:
          - health.stdout | trim == "1,1,1"
        fail_msg: "ERROR: Hay nodos no saludables."
        success_msg: "OK: Los tres nodos tienen health=1."

    - name: Mostrar resultado
      debug:
        msg:
          - ""
          - "============================================================"
          - "        VALIDACION REPLICA SET MONGODB V2"
          - "============================================================"
          - ""
          - "[OK] Autenticacion"
          - "[OK] Replica Set: rs0"
          - "[OK] PRIMARY: mongo1:27017"
          - "[OK] SECONDARY: mongo2:27017"
          - "[OK] SECONDARY: mongo3:27017"
          - "[OK] Total de nodos: 3"
          - "[OK] Salud: 1,1,1"
          - ""
          - "Estado:"
          - "{{ members.stdout }}"
          - ""
          - "============================================================"
          - "        VALIDACION EXITOSA"
          - "============================================================"
