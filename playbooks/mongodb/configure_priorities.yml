---
- name: Configurar prioridades del Replica Set MongoDB
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/common.yml"
    - "{{ playbook_dir }}/../../vars/{{ target_environment | default('local') }}.yml"
    - "{{ playbook_dir }}/../../vars/vault_mongodb.yml"

  vars:
    mongo_network: "mongo_swarm_net"

  tasks:

    - name: Validar existencia de certificado CA publico
      ansible.builtin.stat:
        path: "{{ mongo_tls_ca_cert_path }}"
      register: mongo_ca_stat

    - name: Exigir certificado CA publico
      ansible.builtin.assert:
        that:
          - mongo_ca_stat.stat.exists
          - mongo_ca_stat.stat.isreg
        fail_msg: "[ERROR] Certificado CA no encontrado: {{ mongo_tls_ca_cert_path }}"
        success_msg: "[OK] Certificado CA verificado en el host"

    - name: Detectar PRIMARY actual via conexion TLS
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            const user = process.env.MONGO_ADMIN_USER;
            const pass = process.env.MONGO_ADMIN_PASSWORD;
            const uri = `mongodb://mongo1:27017,mongo2:27018,mongo3:27019/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
            const db = connect(uri);
            db.auth(user, pass);
            print("PRIMARY=" + db.hello().primary);
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: current_primary_raw
      changed_when: false
      no_log: true

    - name: Interpretar PRIMARY actual
      ansible.builtin.set_fact:
        current_primary: "{{ current_primary_raw.stdout_lines | select('match', '^PRIMARY=') | first | regex_replace('^PRIMARY=', '') }}"

    - name: Mostrar PRIMARY actual
      ansible.builtin.debug:
        msg: "PRIMARY actual: {{ current_primary }}"

    - name: Configurar prioridades del Replica Set via TLS
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            const user = process.env.MONGO_ADMIN_USER;
            const pass = process.env.MONGO_ADMIN_PASSWORD;
            const uri = `mongodb://mongo1:27017,mongo2:27018,mongo3:27019/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
            const db = connect(uri);
            db.auth(user, pass);
            const cfg = db.adminCommand({replSetGetConfig: 1}).config;
            cfg.members.forEach(function(m) {
              if (m.host === 'mongo1:27017') {
                m.priority = 2;
              } else if (m.host === 'mongo2:27018') {
                m.priority = 1;
              } else if (m.host === 'mongo3:27019') {
                m.priority = 1;
              }
            });
            cfg.version += 1;
            const res = db.adminCommand({replSetReconfig: cfg});
            if (res.ok !== 1) quit(1);
            print("RECONFIG_OK");
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: priority_config
      changed_when: true
      no_log: true

    - name: Esperar estabilizacion del Replica Set
      ansible.builtin.pause:
        seconds: 10

    - name: Consultar prioridades configuradas via TLS
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            const user = process.env.MONGO_ADMIN_USER;
            const pass = process.env.MONGO_ADMIN_PASSWORD;
            const uri = `mongodb://mongo1:27017,mongo2:27018,mongo3:27019/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
            const db = connect(uri);
            db.auth(user, pass);
            const cfg = db.adminCommand({replSetGetConfig: 1}).config;
            print("PRIORITIES=" + cfg.members.map(m => m.host + ' | priority=' + m.priority).join(';'));
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: priorities_raw
      changed_when: false
      no_log: true

    - name: Interpretar prioridades
      ansible.builtin.set_fact:
        priorities: "{{ priorities_raw.stdout_lines | select('match', '^PRIORITIES=') | first | regex_replace('^PRIORITIES=', '') }}"

    - name: Validar prioridades
      ansible.builtin.assert:
        that:
          - "'mongo1:27017 | priority=2' in priorities"
          - "'mongo2:27018 | priority=1' in priorities"
          - "'mongo3:27019 | priority=1' in priorities"
        fail_msg: "ERROR: Las prioridades no quedaron correctamente configuradas."
        success_msg: "OK: Prioridades configuradas correctamente."

    - name: Esperar que mongo1 sea PRIMARY preferido
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ mongo_network }}"
          - -v
          - "{{ mongo_tls_ca_cert_path }}:{{ mongo_tls_client_ca_file }}:ro"
          - --env
          - MONGO_ADMIN_USER
          - --env
          - MONGO_ADMIN_PASSWORD
          - "{{ mongo_image }}"
          - mongosh
          - --quiet
          - --nodb
          - --eval
          - |
            try {
              const user = process.env.MONGO_ADMIN_USER;
              const pass = process.env.MONGO_ADMIN_PASSWORD;
              const uri = `mongodb://mongo1:27017,mongo2:27018,mongo3:27019/admin?replicaSet={{ mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}`;
              const db = connect(uri);
              db.auth(user, pass);
              print("PREFERRED_PRIMARY=" + db.hello().primary);
            } catch(e) {
              print("PREFERRED_PRIMARY=none");
            }
      environment:
        MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
        MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
      register: preferred_primary_raw
      retries: 60
      delay: 3
      until:
        - preferred_primary_raw.rc == 0
        - "'PREFERRED_PRIMARY=mongo1:27017' in preferred_primary_raw.stdout"
      changed_when: false
      no_log: true

    - name: Mostrar resultado
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "PRIORIDADES REPLICA SET MONGODB V2 (TLS)"
          - "============================================================"
          - "mongo1: priority=2"
          - "mongo2: priority=1"
          - "mongo3: priority=1"
          - ""
          - "[OK] PRIMARY preferido: mongo1:27017"
          - "[OK] mongo1 configurado con mayor prioridad"
          - "============================================================"
