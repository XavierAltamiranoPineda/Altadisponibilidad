---
- name: Crear directorio privado de transaccion
  ansible.builtin.tempfile:
    state: directory
    path: '{{ playbook_dir }}/../../vars'
    prefix: .mongo-admin-rotation.
  register: mongo_admin_transaction_directory

- name: Asegurar permisos del directorio de transaccion
  ansible.builtin.file:
    path: '{{ mongo_admin_transaction_directory.path }}'
    state: directory
    mode: '0700'

- name: Generar password nuevo aleatorio
  ansible.builtin.command:
    argv:
      - openssl
      - rand
      - -hex
      - '24'
  register: mongo_admin_random_password
  changed_when: false
  no_log: true

- name: Preparar contenido actualizado en memoria
  ansible.builtin.set_fact:
    mongo_admin_new_password: '{{ mongo_admin_random_password.stdout | trim }}'
    mongo_admin_vault_updated: >-
      {{
        mongo_admin_vault_plaintext.stdout
        | regex_replace(
            '(?m)^mongo_admin_password:.*$',
            'mongo_admin_password: ' ~ (mongo_admin_random_password.stdout | trim)
          )
      }}
    mongo_admin_new_vault_path: '{{ mongo_admin_transaction_directory.path }}/vault.new.yml'
    mongo_admin_recovery_vault_path: '{{ mongo_admin_transaction_directory.path }}/vault.recovery.yml'
  no_log: true

- name: Cifrar Vault nuevo directamente desde stdin
  ansible.builtin.command:
    argv:
      - ansible-vault
      - encrypt
      - --vault-password-file
      - '{{ ansible_vault_password_file }}'
      - --output
      - '{{ mongo_admin_new_vault_path }}'
      - /dev/stdin
    stdin: '{{ mongo_admin_vault_updated }}'
    stdin_add_newline: true
  no_log: true

- name: Asegurar permisos del Vault cifrado temporal
  ansible.builtin.file:
    path: '{{ mongo_admin_new_vault_path }}'
    state: file
    mode: '0600'

- name: Validar descifrado del Vault temporal
  ansible.builtin.command:
    argv:
      - ansible-vault
      - view
      - --vault-password-file
      - '{{ ansible_vault_password_file }}'
      - '{{ mongo_admin_new_vault_path }}'
  register: mongo_admin_new_vault_validation
  changed_when: false
  no_log: true

- name: Confirmar valor nuevo dentro del Vault temporal
  ansible.builtin.assert:
    that:
      - (mongo_admin_new_vault_validation.stdout | from_yaml).mongo_admin_password == mongo_admin_new_password
    fail_msg: 'Vault temporal cifrado no contiene valor nuevo esperado.'
  no_log: true

- name: Crear copia cifrada recuperable antes de cambiar MongoDB
  ansible.builtin.copy:
    src: '{{ mongo_admin_new_vault_path }}'
    dest: '{{ mongo_admin_recovery_vault_path }}'
    remote_src: true
    mode: '0600'
  no_log: true

- name: Validar copia cifrada recuperable
  ansible.builtin.command:
    argv:
      - ansible-vault
      - view
      - --vault-password-file
      - '{{ ansible_vault_password_file }}'
      - '{{ mongo_admin_recovery_vault_path }}'
  register: mongo_admin_recovery_vault_validation
  changed_when: false
  no_log: true

- name: Confirmar valor nuevo en copia recuperable
  ansible.builtin.assert:
    that:
      - (mongo_admin_recovery_vault_validation.stdout | from_yaml).mongo_admin_password == mongo_admin_new_password
    fail_msg: 'Copia cifrada de recuperacion no es valida.'
  no_log: true

- name: Marcar inicio de mutacion MongoDB
  ansible.builtin.set_fact:
    mongo_admin_password_change_attempted: true

- name: Cambiar password en MongoDB sin secretos en argv
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - '{{ mongo_network }}'
      - --env
      - MONGO_ADMIN_USER
      - --env
      - MONGO_ADMIN_PASSWORD
      - --env
      - MONGO_ADMIN_NEW_PASSWORD
      - --env
      - MONGO_ADMIN_URI
      - '{{ mongo_image }}'
      - mongosh
      - --quiet
      - --nodb
    stdin: '{{ mongo_admin_change_script }}'
    stdin_add_newline: true
  environment:
    MONGO_ADMIN_USER: '{{ mongo_admin_user }}'
    MONGO_ADMIN_PASSWORD: '{{ mongo_admin_password }}'
    MONGO_ADMIN_NEW_PASSWORD: '{{ mongo_admin_new_password }}'
    MONGO_ADMIN_URI: '{{ mongo_admin_mongosh_uri }}'
  register: mongo_admin_rotation
  changed_when: >-
    'ADMIN_PASSWORD_CHANGE_ACCEPTED' in mongo_admin_rotation.stdout
  failed_when: >-
    mongo_admin_rotation.rc != 0 or
    'ADMIN_PASSWORD_CHANGE_ACCEPTED' not in mongo_admin_rotation.stdout
  no_log: true

- name: Validar password nuevo antes de consolidar Vault
  ansible.builtin.include_tasks: mongo_admin_auth_check.yml
  vars:
    mongo_admin_auth_password: '{{ mongo_admin_new_password }}'
  no_log: true

- name: Abortar si password nuevo no autentica
  ansible.builtin.fail:
    msg: 'MongoDB no acepto password nuevo despues del cambio.'
  when: not (mongo_admin_auth_check_ok | bool)

- name: Reemplazar Vault de forma atomica
  ansible.builtin.command:
    argv:
      - mv
      - --
      - '{{ mongo_admin_new_vault_path }}'
      - '{{ mongo_vault_path }}'
  changed_when: true

- name: Marcar Vault definitivo consolidado
  ansible.builtin.set_fact:
    mongo_admin_vault_committed: true

- name: Validar descifrado del Vault definitivo
  ansible.builtin.command:
    argv:
      - ansible-vault
      - view
      - --vault-password-file
      - '{{ ansible_vault_password_file }}'
      - '{{ mongo_vault_path }}'
  register: mongo_admin_final_vault_validation
  changed_when: false
  no_log: true

- name: Confirmar valor nuevo en Vault definitivo
  ansible.builtin.assert:
    that:
      - (mongo_admin_final_vault_validation.stdout | from_yaml).mongo_admin_password == mongo_admin_new_password
    fail_msg: 'Vault definitivo no contiene valor nuevo esperado.'
  no_log: true

- name: Validar nuevamente password nuevo
  ansible.builtin.include_tasks: mongo_admin_auth_check.yml
  vars:
    mongo_admin_auth_password: '{{ mongo_admin_new_password }}'
  no_log: true

- name: Abortar si password nuevo deja de autenticar
  ansible.builtin.fail:
    msg: 'MongoDB no acepta password nuevo despues de consolidar Vault.'
  when: not (mongo_admin_auth_check_ok | bool)

- name: Comprobar rechazo del password anterior
  ansible.builtin.include_tasks: mongo_admin_auth_check.yml
  vars:
    mongo_admin_auth_password: '{{ mongo_admin_password }}'
  no_log: true

- name: Abortar si password anterior sigue aceptado
  ansible.builtin.fail:
    msg: 'MongoDB aun acepta password anterior despues de consolidar Vault.'
  when: mongo_admin_auth_check_ok | bool

- name: Marcar rotacion completada
  ansible.builtin.set_fact:
    mongo_admin_rotation_succeeded: true
