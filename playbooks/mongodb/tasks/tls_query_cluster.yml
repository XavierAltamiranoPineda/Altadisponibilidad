---
# ============================================================
# Consulta segura de topologia de Replica Set sin passwords en argv
# ============================================================

- name: Consultar topología saludable del Replica Set
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - "{{ mongo_network }}"
      - --mount
      - "type=bind,src={{ mongo_tls_ca_cert_path }},dst=/run/mongo-ca/mongo_ca.pem,readonly"
      - --env
      - MONGO_ADMIN_USER
      - --env
      - MONGO_ADMIN_PASSWORD
      - --env
      - MONGO_REPLSET
      - "{{ mongo_image }}"
      - mongosh
      - --quiet
      - --nodb
      - --eval
      - |
          const user = process.env.MONGO_ADMIN_USER;
          const pass = process.env.MONGO_ADMIN_PASSWORD;
          const replSet = process.env.MONGO_REPLSET;
          const expected = ['mongo1:27017', 'mongo2:27017', 'mongo3:27017'];
          const requiredNode = '{{ mongo_tls_cluster_expected_node | default('') }}';
          const requiredState = '{{ mongo_tls_cluster_expected_state | default('') }}';
          const expectedMode = '{{ mongo_tls_expected_mode | default(mongo_tls_deployment_mode | default("allowTLS")) }}';

          const tlsPart =
            ['allowTLS', 'preferTLS', 'requireTLS'].includes(expectedMode)
              ? '&tls=true&tlsCAFile=/run/mongo-ca/mongo_ca.pem'
              : '';

          const uri =
            `mongodb://${encodeURIComponent(user)}:${encodeURIComponent(pass)}` +
            `@mongo1:27017,mongo2:27017,mongo3:27017/admin` +
            `?replicaSet=${replSet}` +
            `&serverSelectionTimeoutMS=5000` +
            tlsPart;

          let result;
          for (let attempt = 0; attempt < {{ mongo_tls_cluster_retries | default(20) }}; attempt++) {
            try {
              const db = connect(uri);
              const status = db.adminCommand({replSetGetStatus: 1});
              const config = db.adminCommand({replSetGetConfig: 1}).config;

              const members = status.members.map(m => ({
                name: m.name,
                service: m.name.split(':')[0],
                state: m.state,
                stateStr: m.stateStr,
                health: m.health
              }));

              const healthy =
                status.set === replSet &&
                members.length === 3 &&
                members.filter(m => m.stateStr === 'PRIMARY' && m.health === 1).length === 1 &&
                members.filter(m => m.stateStr === 'SECONDARY' && m.health === 1).length === 2 &&
                members.every(m => expected.includes(m.name));

              const requiredHealthy =
                !requiredNode ||
                members.some(m =>
                  m.service === requiredNode &&
                  m.stateStr === requiredState &&
                  m.health === 1
                );

              result = {
                set: status.set,
                members,
                primary: (members.find(m => m.stateStr === 'PRIMARY') || {}).service,
                secondaries: members
                  .filter(m => m.stateStr === 'SECONDARY')
                  .map(m => m.service),
                config: {
                  _id: config._id,
                  version: config.version,
                  protocolVersion: config.protocolVersion,
                  writeConcernMajorityJournalDefault: config.writeConcernMajorityJournalDefault,
                  members: config.members,
                  settings: config.settings
                },
                healthy,
                requiredHealthy
              };

              if (healthy && requiredHealthy) break;
            } catch (err) {
              result = {
                healthy: false,
                requiredHealthy: false,
                error: err.message
              };
            }

            sleep({{ (mongo_tls_cluster_delay | default(2) | int) * 1000 }});
          }

          print('TLS_CLUSTER_JSON=' + JSON.stringify(result));
  environment:
    MONGO_ADMIN_USER: "{{ mongo_admin_user }}"
    MONGO_ADMIN_PASSWORD: "{{ mongo_admin_password }}"
    MONGO_REPLSET: "{{ mongo_replica_set }}"
  register: mongo_tls_cluster_raw
  changed_when: false
  no_log: true

- name: Interpretar topología del Replica Set
  ansible.builtin.set_fact:
    mongo_tls_cluster_status: >-
      {{
        (mongo_tls_cluster_raw.stdout_lines
         | select('match', '^TLS_CLUSTER_JSON=') | first
         | regex_replace('^TLS_CLUSTER_JSON=', ''))
        | from_json
      }}
  no_log: true

- name: Mostrar topología no sensible
  ansible.builtin.debug:
    msg:
      primary: "{{ mongo_tls_cluster_status.primary }}"
      secondaries: "{{ mongo_tls_cluster_status.secondaries }}"
      members: "{{ mongo_tls_cluster_status.members }}"

- name: Validar topología interpretada
  ansible.builtin.assert:
    that:
      - mongo_tls_cluster_status.healthy | bool
      - mongo_tls_cluster_status.requiredHealthy | bool
      - mongo_tls_cluster_status.set == mongo_replica_set
      - mongo_tls_cluster_status.members | length == 3
      - mongo_tls_cluster_status.secondaries | length == 2
      - mongo_tls_cluster_status.primary in mongo_tls_service_names
    fail_msg: "Replica Set no está saludable."
