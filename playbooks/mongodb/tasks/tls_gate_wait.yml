---
# ============================================================
# Espera de barrera: todas las tareas viejas muertas y nuevas esperando gate
# ============================================================

- name: Validar baseline explicito de la barrera
  ansible.builtin.assert:
    that:
      - mongo_tls_barrier_old_task_info is mapping
      - mongo_tls_service_names | difference(mongo_tls_barrier_old_task_info.keys() | list) | length == 0
    fail_msg: "La barrera requiere mongo_tls_barrier_old_task_info completo y explicito."

- name: Validar IDs del baseline de barrera por nodo
  ansible.builtin.assert:
    that:
      - mongo_tls_barrier_old_task_info[item].task_id | length > 0
      - mongo_tls_barrier_old_task_info[item].container_id | length > 0
    fail_msg: "Baseline de barrera incompleto para {{ item }}."
  loop: "{{ mongo_tls_service_names }}"

- name: Reiniciar tracking de las tasks nuevas para esta barrera
  ansible.builtin.set_fact:
    mongo_tls_task_info: {}
    mongo_tls_all_old_mongod_gone: false
    mongo_tls_all_new_tasks_waiting_gate: false

- name: Esperar que las 3 nuevas tasks esten en estado running
  ansible.builtin.command:
    argv:
      - curl
      - --silent
      - --fail-with-body
      - --unix-socket
      - /var/run/docker.sock
      - "http://localhost/tasks?filters=%7B%22service%22%3A%5B%22{{ item }}%22%5D%2C%22desired-state%22%3A%5B%22running%22%5D%7D"
  register: mongo_tls_new_tasks_raw
  loop: "{{ mongo_tls_service_names }}"
  changed_when: false
  retries: 60
  delay: 3
  until:
    - mongo_tls_new_tasks_raw.rc == 0
    - (mongo_tls_new_tasks_raw.stdout | from_json | selectattr('Status.State', 'equalto', 'running') | list | length) == 1

- name: Extraer new_task_id y new_container_id de las tareas activas
  ansible.builtin.set_fact:
    mongo_tls_task_info: >-
      {{
        mongo_tls_task_info | default({}) | combine({
          item.item: {
            'task_id': (item.stdout | from_json | selectattr('Status.State', 'equalto', 'running') | map(attribute='ID') | first),
            'container_id': (item.stdout | from_json | selectattr('Status.State', 'equalto', 'running') | map(attribute='Status') | map(attribute='ContainerStatus') | map(attribute='ContainerID') | first)
          }
        })
      }}
  loop: "{{ mongo_tls_new_tasks_raw.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Validar que TaskID y ContainerID nuevos son distintos de los antiguos
  ansible.builtin.assert:
    that:
      - mongo_tls_task_info[item].task_id != mongo_tls_barrier_old_task_info[item].task_id
      - mongo_tls_task_info[item].container_id != mongo_tls_barrier_old_task_info[item].container_id
    fail_msg: "Task o contenedor de {{ item }} no fue reemplazado por Swarm."
  loop: "{{ mongo_tls_service_names }}"

- name: Verificar que las tareas antiguas estan en Shutdown/Complete/Failed
  ansible.builtin.command:
    argv:
      - curl
      - --silent
      - --fail-with-body
      - --unix-socket
      - /var/run/docker.sock
      - "http://localhost/tasks/{{ mongo_tls_barrier_old_task_info[item].task_id }}"
  register: mongo_tls_old_task_state_raw
  loop: "{{ mongo_tls_service_names }}"
  changed_when: false
  retries: 30
  delay: 2
  until:
    - (mongo_tls_old_task_state_raw.stdout | from_json).Status.State in ['shutdown', 'complete', 'failed']

- name: Verificar que los contenedores antiguos no estan ejecutandose
  ansible.builtin.command:
    argv:
      - curl
      - --silent
      - --write-out
      - "\n%{http_code}"
      - --unix-socket
      - /var/run/docker.sock
      - "http://localhost/containers/{{ mongo_tls_barrier_old_task_info[item].container_id }}/json"
  register: mongo_tls_old_container_state_raw
  loop: "{{ mongo_tls_service_names }}"
  changed_when: false
  retries: 30
  delay: 2
  until:
    - >
      (mongo_tls_old_container_state_raw.stdout_lines | last) == '404' or
      (
        (mongo_tls_old_container_state_raw.stdout_lines | last) == '200' and
        ((mongo_tls_old_container_state_raw.stdout_lines[0:-1] | join('\n') | from_json).State.Running == false)
      )

- name: Esperar que los 3 contenedores nuevos alcancen /tmp/gate-ready
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ mongo_tls_task_info[item].container_id }}"
      - test
      - -f
      - /tmp/gate-ready
  loop: "{{ mongo_tls_service_names }}"
  register: mongo_tls_gate_ready_raw
  changed_when: false
  retries: 60
  delay: 3
  until: mongo_tls_gate_ready_raw.rc == 0

- name: Confirmar que mongod NO esta corriendo en ningun contenedor nuevo
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ mongo_tls_task_info[item].container_id }}"
      - pgrep
      - -x
      - mongod
  loop: "{{ mongo_tls_service_names }}"
  register: mongo_tls_pgrep_raw
  changed_when: false
  failed_when: mongo_tls_pgrep_raw.rc != 1

- name: Confirmar barrera completa para los tres nodos
  ansible.builtin.set_fact:
    mongo_tls_all_old_mongod_gone: true
    mongo_tls_all_new_tasks_waiting_gate: true
    mongo_tls_gate_ready_nodes:
      mongo1: true
      mongo2: true
      mongo3: true
