---
- name: Ejecutar rotacion del administrador bajo lock global
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - '{{ playbook_dir }}/../../vars/common.yml'
    - '{{ playbook_dir }}/../../vars/{{ target_environment | default(''local'') }}.yml'

  vars:
    mongo_admin_rotation_environment: '{{ target_environment | default(''local'') }}'
    mongo_admin_rotation_lock_file: '{{ backup_log_root }}/{{ backup_lock_filename }}'

  tasks:
    - name: Validar alcance local
      ansible.builtin.assert:
        that:
          - mongo_admin_rotation_environment == 'local'
          - environment_name == 'local'
        fail_msg: 'Rotacion autorizada solo para LOCAL.'

    - name: Validar directorio del lock compartido
      ansible.builtin.stat:
        path: '{{ backup_log_root }}'
      register: mongo_admin_lock_directory
      when: not (rotate_admin_password_lock_held | default(false) | bool)

    - name: Confirmar directorio privado de logs
      ansible.builtin.assert:
        that:
          - mongo_admin_lock_directory.stat.exists
          - mongo_admin_lock_directory.stat.isdir
          - mongo_admin_lock_directory.stat.mode == '0700'
        fail_msg: 'Directorio del lock global no existe o no tiene mode 0700.'
      when: not (rotate_admin_password_lock_held | default(false) | bool)

    - name: Adquirir lock y ejecutar proceso interno
      when: not (rotate_admin_password_lock_held | default(false) | bool)
      block:
        - name: Reejecutar playbook conservando lock durante toda la operacion
          ansible.builtin.command:
            argv:
              - /usr/bin/flock
              - --nonblock
              - --no-fork
              - --conflict-exit-code
              - '75'
              - '{{ mongo_admin_rotation_lock_file }}'
              - /usr/bin/ansible-playbook
              - '{{ playbook_dir }}/rotate_admin_password.yml'
              - --vault-password-file
              - '{{ ansible_vault_password_file }}'
              - -e
              - 'target_environment={{ mongo_admin_rotation_environment }}'
              - -e
              - rotate_admin_password_lock_held=true
              - -e
              - >-
                rotate_admin_password_confirm={{
                  (rotate_admin_password_confirm | default(false) | bool)
                  | ternary('true', 'false')
                }}
          register: mongo_admin_locked_run
          changed_when: >-
            'ADMIN_PASSWORD_ROTATED=true' in mongo_admin_locked_run.stdout
          failed_when: false

      always:
        - name: Confirmar liberacion automatica del descriptor flock
          ansible.builtin.debug:
            msg: 'Lock global liberado al terminar el proceso flock.'

    - name: Validar adquisicion del lock y ejecucion interna
      ansible.builtin.assert:
        that:
          - mongo_admin_locked_run.rc == 0
        fail_msg: >-
          {{ 'Backup, restore o mantenimiento concurrente mantiene el lock global; no se cambio nada.'
             if mongo_admin_locked_run.rc == 75
             else 'Rotacion interna fallo. No reejecutar con confirmacion hasta revisar el diagnostico.' }}
      when: not (rotate_admin_password_lock_held | default(false) | bool)

    - name: Mostrar resultado interno no sensible
      ansible.builtin.debug:
        msg: >-
          {{ mongo_admin_locked_run.stdout
             | regex_findall('ADMIN_PASSWORD_(?:PREFLIGHT|ROTATED|RECOVERY)=[^\n]+') }}
      when:
        - not (rotate_admin_password_lock_held | default(false) | bool)
        - mongo_admin_locked_run.rc == 0

    - name: Finalizar proceso externo
      ansible.builtin.meta: end_play
      when: not (rotate_admin_password_lock_held | default(false) | bool)

- name: Validar o rotar password del administrador MongoDB
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - '{{ playbook_dir }}/../../vars/common.yml'
    - '{{ playbook_dir }}/../../vars/{{ target_environment | default(''local'') }}.yml'
    - '{{ playbook_dir }}/../../vars/vault_mongodb.yml'

  vars:
    mongo_network: mongo_swarm_net
    mongo_vault_path: '{{ playbook_dir }}/../../vars/vault_mongodb.yml'
    mongo_admin_mongosh_uri: >-
      mongodb://mongo1:27017,mongo2:27018,mongo3:27019/admin?replicaSet={{
      mongo_replica_set }}&tls=true&tlsCAFile={{ mongo_tls_client_ca_file }}&serverSelectionTimeoutMS=10000
    mongo_admin_auth_script: |
      const user = process.env.MONGO_ADMIN_USER;
      const password = process.env.MONGO_ADMIN_PASSWORD;
      const baseUri = process.env.MONGO_ADMIN_URI;
      const separator = baseUri.includes('?') ? '&' : '?';
      const uri = baseUri.replace(
        'mongodb://',
        `mongodb://${encodeURIComponent(user)}:${encodeURIComponent(password)}@`
      ) + `${separator}authSource=admin`;
      const adminDb = new Mongo(uri).getDB('admin');
      const result = adminDb.runCommand({connectionStatus: 1});
      if (result.ok !== 1) quit(42);
      const authenticated = result.authInfo.authenticatedUsers.some(
        entry => entry.user === user && entry.db === 'admin'
      );
      if (!authenticated) quit(43);
      print('ADMIN_AUTH_OK');
    mongo_admin_change_script: |
      const user = process.env.MONGO_ADMIN_USER;
      const password = process.env.MONGO_ADMIN_PASSWORD;
      const newPassword = process.env.MONGO_ADMIN_NEW_PASSWORD;
      const baseUri = process.env.MONGO_ADMIN_URI;
      const separator = baseUri.includes('?') ? '&' : '?';
      const uri = baseUri.replace(
        'mongodb://',
        `mongodb://${encodeURIComponent(user)}:${encodeURIComponent(password)}@`
      ) + `${separator}authSource=admin`;
      const adminDb = new Mongo(uri).getDB('admin');
      adminDb.changeUserPassword(user, newPassword);
      print('ADMIN_PASSWORD_CHANGE_ACCEPTED');

  tasks:
    - name: Omitir ejecucion interna sin lock
      ansible.builtin.meta: end_play
      when: not (rotate_admin_password_lock_held | default(false) | bool)

    - name: Validar alcance y lock interno
      ansible.builtin.assert:
        that:
          - target_environment | default('local') == 'local'
          - environment_name == 'local'
          - rotate_admin_password_lock_held | bool
        fail_msg: 'Rotacion autorizada solo para LOCAL y bajo lock global.'

    - name: Inspeccionar Vault actual
      ansible.builtin.stat:
        path: '{{ mongo_vault_path }}'
      register: mongo_admin_vault_stat

    - name: Leer Vault actual
      ansible.builtin.command:
        argv:
          - ansible-vault
          - view
          - --vault-password-file
          - '{{ ansible_vault_password_file }}'
          - '{{ mongo_vault_path }}'
      register: mongo_admin_vault_plaintext
      changed_when: false
      no_log: true

    - name: Validar estructura y valor cargado del Vault
      ansible.builtin.assert:
        that:
          - mongo_admin_vault_stat.stat.exists
          - mongo_admin_vault_stat.stat.isreg
          - (mongo_admin_vault_plaintext.stdout | regex_findall('(?m)^mongo_admin_password:.*$') | length) == 1
          - (mongo_admin_vault_plaintext.stdout | from_yaml).mongo_admin_password == mongo_admin_password
        fail_msg: 'Vault no contiene una clave mongo_admin_password unica y coherente.'
      no_log: true

    - name: Validar autenticacion con password actual
      ansible.builtin.include_tasks: tasks/mongo_admin_auth_check.yml
      vars:
        mongo_admin_auth_password: '{{ mongo_admin_password }}'
      no_log: true

    - name: Abortar ante divergencia MongoDB Vault
      ansible.builtin.fail:
        msg: >-
          MongoDB no acepta el password del Vault actual. No se genero ni cambio ningun password.
          No reejecutar rotacion a ciegas. Revisar Vaults cifrados
          vars/.mongo-admin-rotation.*/vault.recovery.yml y usar
          playbooks/recovery/mongo_recover_admin.yml para reconciliar MongoDB y Vault.
      when: not (mongo_admin_auth_check_ok | bool)

    - name: Finalizar despues del preflight sin confirmacion explicita
      when: not (rotate_admin_password_confirm | default(false) | bool)
      block:
        - name: Mostrar preflight sin cambios
          ansible.builtin.debug:
            msg: 'ADMIN_PASSWORD_PREFLIGHT=ok; rotation=skipped; confirmation=required'

        - name: Detener antes de generar un password nuevo
          ansible.builtin.meta: end_play

    - name: Inicializar estado transaccional
      ansible.builtin.set_fact:
        mongo_admin_password_change_attempted: false
        mongo_admin_vault_committed: false
        mongo_admin_rotation_succeeded: false
        mongo_admin_preserve_recovery: false

    - name: Rotar password y consolidar Vault
      block:
        - name: Ejecutar transaccion protegida
          ansible.builtin.include_tasks: tasks/rotate_admin_password_transaction.yml

      rescue:
        - name: Preservar Vault cifrado ante mutacion posible
          ansible.builtin.set_fact:
            mongo_admin_preserve_recovery: '{{ mongo_admin_password_change_attempted | bool }}'

        - name: Abortar con instrucciones de recuperacion
          ansible.builtin.fail:
            msg: >-
              {{
                ('ADMIN_PASSWORD_RECOVERY=required; MongoDB pudo aceptar el cambio. '
                 ~ 'No se intento rollback automatico. Conservar Vault cifrado: '
                 ~ (mongo_admin_recovery_vault_path | default('ruta no creada'))
                 ~ '. No reejecutar rotacion. Validar ambos Vaults y reconciliar con '
                 ~ 'playbooks/recovery/mongo_recover_admin.yml.')
                if mongo_admin_password_change_attempted | bool
                else
                'Rotacion fallo antes de intentar cambiar MongoDB; no hubo mutacion.'
              }}

      always:
        - name: Limpiar transaccion o conservar recuperacion cifrada
          ansible.builtin.file:
            path: '{{ mongo_admin_transaction_directory.path }}'
            state: absent
          when:
            - mongo_admin_transaction_directory is defined
            - not (mongo_admin_preserve_recovery | default(false) | bool)
          no_log: true

    - name: Mostrar resultado no sensible
      ansible.builtin.debug:
        msg: 'ADMIN_PASSWORD_ROTATED=true; vault=committed; old_password=rejected'
      when: mongo_admin_rotation_succeeded | bool
